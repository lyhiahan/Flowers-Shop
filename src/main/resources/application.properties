spring.application.name=finalproject

# Server port
server.port=8080
spring.devtools.restart.enabled=false
spring.mvc.welcome-page.enabled=false
server.error.include-message=always
server.error.include-stacktrace=always

# ===============================
# DATABASE CONFIGURATION (SQL SERVER SQLEXPRESS01)
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:56003;databaseName=RentalShop;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=giahan
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===============================
# SPRING MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.rentalshop@gmail.com
spring.mail.password=app-password-placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=demo
cloudinary.api-key=123456789
cloudinary.api-secret=placeholder_secret

# ===============================
# MULTIPART / FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
