<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: assets(${isEdit ? 'Chính Sửa Thuộc Tính Sản Phẩm' : 'Thêm Mới Thuộc Tính Sản Phẩm'} + ' - Quản Trị Hệ Thống Hoa Tươi')}">
</head>
<body class="admin-body">
<div class="admin-layout-wrapper">
    <!-- Sidebar thống nhất chuẩn Quản trị viên -->
    <aside th:replace="~{fragments/admin-layout :: sidebar('styles')}"></aside>

    <!-- Main Content -->
    <main class="main-wrapper-admin">
        <div th:replace="~{fragments/admin-layout :: mobile-topbar(${isEdit ? 'Chỉnh sửa thuộc tính' : 'Thêm thuộc tính'})}"></div>
        <!-- Header & Back button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/styles}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" style="border-radius: 10px; height: 42px;">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
                <h1 class="admin-page-title mb-0" style="font-size: 24px !important; font-weight: 800; color: #20382E;"
                    th:text="${isEdit ? 'Chỉnh sửa nhóm thuộc tính: ' + style.name : 'Thêm mới nhóm thuộc tính'}">
                    Thêm mới nhóm thuộc tính
                </h1>
            </div>
        </div>

        <!-- Form Card (Nhập thông tin nhóm thuộc tính) -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="border: 1px solid #E2E7E2 !important; max-width: 800px;">
            <form id="styleForm" th:action="${isEdit ? '/admin/styles/update/' + style.id : '/admin/styles/add'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Tên nhóm thuộc tính (*):</label>
                    <input type="text" name="name" id="styleNameInput" class="form-control" th:value="${style.name}" 
                           placeholder="VD: Màu sắc, Kiểu dáng, Loại hoa, Dịp tặng..." 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Phạm vi áp dụng (nếu chỉ áp dụng riêng cho một danh mục hoa):</label>
                    <select name="categoryId" id="styleCategorySelect" class="form-select" style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;">
                        <option value="0">-- Áp dụng chung cho tất cả sản phẩm --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" 
                                th:selected="${style.category != null and style.category.id == c.id}" 
                                th:text="${c.name}"></option>
                    </select>
                </div>

                <!-- Bấm nút Submit -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/styles}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        Hủy
                    </a>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold" 
                            id="btnSubmitStyle" data-testid="btnSubmitStyle"
                            onclick="triggerConfirmStyleModal()"
                            style="border-radius: 10px; background-color: #20382E !important; border-color: #20382E !important;">
                        <i class="bi bi-check2-circle me-1"></i> Lưu nhóm thuộc tính
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- Modal xác nhận lưu nhóm thuộc tính -->
<div class="modal fade" id="confirmStyleModal" tabindex="-1" aria-labelledby="confirmStyleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-serif fw-bold text-dark" id="confirmStyleModalLabel">
                    ✨ Xác Nhận Lưu Nhóm Thuộc Tính
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3 text-secondary">
                Bạn có chắc chắn muốn lưu thông tin nhóm thuộc tính:
                <div class="alert alert-info py-2 px-3 mt-2 mb-0 fw-bold" id="confirmStyleNameDisplay">
                    Tên nhóm thuộc tính
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <!-- Alternative 11h: Bấm nút Cancel -> 12h: Hủy thao tác -->
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelStyle" data-testid="btnCancelStyle">
                    Hủy bỏ
                </button>
                <!-- Bước 10: Bấm nút Confirm -> Bước 11: Thông báo thành công -->
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold text-white" 
                        id="btnConfirmStyle" data-testid="btnConfirmStyle"
                        onclick="document.getElementById('styleForm').submit();">
                    Xác nhận lưu
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<script>
    function triggerConfirmStyleModal() {
        const nameInput = document.getElementById('styleNameInput');
        if (!nameInput.value || nameInput.value.trim() === '') {
            nameInput.reportValidity();
            return;
        }
        document.getElementById('confirmStyleNameDisplay').innerText = nameInput.value.trim();
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmStyleModal'));
        confirmModal.show();
    }
</script>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
