<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: assets(${isEdit ? 'Chính Sửa Loại Sản Phẩm' : 'Thêm Mới Loại Sản Phẩm'} + ' - Quản Trị Hệ Thống Hoa Tươi')}">
</head>
<body class="admin-body">
<div class="admin-layout-wrapper">
    <!-- Sidebar thống nhất chuẩn Quản trị viên -->
    <aside th:replace="~{fragments/admin-layout :: sidebar('categories')}"></aside>

    <!-- Main Content -->
    <main class="main-wrapper-admin">
        <div th:replace="~{fragments/admin-layout :: mobile-topbar(${isEdit ? 'Chỉnh sửa loại sản phẩm' : 'Thêm loại sản phẩm'})}"></div>
        <!-- Header & Back button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" style="border-radius: 10px; height: 42px;">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
                <h1 class="admin-page-title mb-0" style="font-size: 24px !important; font-weight: 800; color: #20382E;"
                    th:text="${isEdit ? 'Chỉnh sửa loại sản phẩm: ' + category.name : 'Thêm mới loại sản phẩm hoa tươi'}">
                    Thêm mới loại sản phẩm
                </h1>
            </div>
        </div>

        <!-- Form Card (BƯỚC 7 & 8 THEO UC_030: Chuyển đến trang form tạo category mới, nhập đầy đủ thông tin) -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="border: 1px solid #E2E7E2 !important; max-width: 800px;">
            <form id="categoryForm" th:action="${isEdit ? '/admin/categories/update/' + category.id : '/admin/categories/add'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Tên loại sản phẩm hoa tươi (*):</label>
                    <input type="text" name="name" id="categoryNameInput" class="form-control" th:value="${category.name}" 
                           placeholder="VD: Hoa Cưới Cầm Tay Cô Dâu" 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Danh mục cha (nếu là danh mục con thuộc cây category):</label>
                    <select name="parentId" id="categoryParentSelect" class="form-select" style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;">
                        <option value="0">-- Là danh mục gốc (không có cha) --</option>
                        <option th:each="c : ${allCategories}" th:value="${c.id}" 
                                th:selected="${category.parent != null and category.parent.id == c.id}" 
                                th:text="${c.name}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Mô tả chi tiết:</label>
                    <textarea name="description" id="categoryDescInput" rows="4" class="form-control" th:text="${category.description}"
                              placeholder="Mô tả phong cách, dịp lễ phù hợp và các đặc trưng của danh mục này..." 
                              style="border-radius: 10px; border-color: #E2E7E2; font-size: 14.5px;"></textarea>
                </div>

                <!-- BƯỚC 9 THEO UC_030: Bấm nút Submit -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        Hủy
                    </a>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold" 
                            id="btnSubmitCategory" data-testid="btnSubmitCategory"
                            onclick="triggerConfirmModal()"
                            style="border-radius: 10px; background-color: #20382E !important; border-color: #20382E !important;">
                        <i class="bi bi-check2-circle me-1"></i> Submit
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- BƯỚC 10 & 11 THEO UC_030: Hiển thị thông báo yêu cầu xác nhận -> Bấm nút Confirm -->
<div class="modal fade" id="confirmCategoryModal" tabindex="-1" aria-labelledby="confirmCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-serif fw-bold text-dark" id="confirmCategoryModalLabel">
                    🌸 Xác Nhận Lưu Loại Sản Phẩm
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3 text-secondary">
                Bạn có chắc chắn muốn lưu thông tin loại sản phẩm:
                <div class="alert alert-info py-2 px-3 mt-2 mb-0 fw-bold" id="confirmCatNameDisplay">
                    Tên loại sản phẩm
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <!-- Alternative 11d: Bấm nút Cancel -> 12d: Hủy thao tác -->
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelCategory" data-testid="btnCancelCategory">
                    Cancel
                </button>
                <!-- Bước 11: Bấm nút Confirm -> Bước 12: Thông báo thành công -->
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold text-white" 
                        id="btnConfirmCategory" data-testid="btnConfirmCategory"
                        onclick="document.getElementById('categoryForm').submit();">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<script>
    function triggerConfirmModal() {
        const nameInput = document.getElementById('categoryNameInput');
        if (!nameInput || !nameInput.value.trim()) {
            alert('Vui lòng nhập tên loại sản phẩm!');
            nameInput && nameInput.focus();
            return;
        }
        document.getElementById('confirmCatNameDisplay').innerText = nameInput.value.trim();
        const modal = new bootstrap.Modal(document.getElementById('confirmCategoryModal'));
        modal.show();
    }
</script>
<script th:src="@{/js/global-modal.js}"></script>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
