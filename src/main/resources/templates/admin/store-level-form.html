<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: assets(${isEdit ? 'Chính sửa cấp bậc cửa hàng' : 'Thêm mới cấp bậc cửa hàng'})}"></th:block>
</head>
<body class="admin-body">
<div class="admin-layout-wrapper">
    <aside th:replace="~{fragments/admin-layout :: sidebar('store-levels')}"></aside>
    <main class="main-wrapper-admin">
        <div th:replace="~{fragments/admin-layout :: mobile-topbar(${isEdit ? 'Chỉnh sửa cấp bậc' : 'Thêm cấp bậc'})}"></div>
        <div class="p-4">
        <!-- Header & Back button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/store-levels}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" style="border-radius: 10px; height: 42px;">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
                <h1 class="admin-page-title mb-0" style="font-size: 24px !important; font-weight: 800; color: #20382E;"
                    th:text="${isEdit ? 'Chỉnh sửa cấp bậc cửa hàng: ' + storeLevel.name : 'Thêm mới cấp bậc cửa hàng (New level)'}">
                    Thêm mới cấp bậc cửa hàng
                </h1>
            </div>
        </div>

        <!-- Form Card (BƯỚC 7 & 8 THEO UC_033: Hiển thị form thêm level mới, nhập đầy đủ thông tin) -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="border: 1px solid #E2E7E2 !important; max-width: 800px;">
            <form id="storeLevelForm" th:action="${isEdit ? '/admin/store-levels/update/' + storeLevel.id : '/admin/store-levels/add'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Tên cấp bậc cửa hàng (*):</label>
                    <input type="text" name="name" id="storeLevelNameInput" class="form-control" th:value="${storeLevel.name}" 
                           placeholder="VD: Cửa Hàng Uy Tín, Đối Tác Kim Cương..." 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Doanh số tích lũy tối thiểu (VNĐ) (*):</label>
                    <input type="number" name="minPoint" id="storeLevelMinPointInput" class="form-control" th:value="${storeLevel.minPoint}" 
                           placeholder="VD: 0 (Tiêu chuẩn), 10000000 (Uy tín), 30000000 (Xuất sắc)..." min="0"
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                    <small class="text-muted">Doanh thu bán hoa tối thiểu để chi nhánh đạt danh hiệu và cấp bậc này.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Mức giảm chiết khấu sàn (%) (*):</label>
                    <input type="number" name="discount" id="storeLevelDiscountInput" class="form-control" th:value="${storeLevel.discount}" 
                           placeholder="VD: 0, 5, 10..." min="0" max="100" step="0.5"
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                    <small class="text-muted">Phần trăm ưu đãi giảm phí hoa hồng sàn dành riêng cho đối tác đạt cấp bậc này.</small>
                </div>

                <!-- BƯỚC 9 THEO UC_033: Bấm nút Submit -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/store-levels}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        Hủy
                    </a>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold" 
                            id="btnSubmitStoreLevel" data-testid="btnSubmitStoreLevel"
                            onclick="triggerConfirmStoreLevelModal()"
                            style="border-radius: 10px; background-color: #20382E !important; border-color: #20382E !important;">
                        <i class="bi bi-check2-circle me-1"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- BƯỚC 10 & 11 THEO UC_033: Hiển thị thông báo yêu cầu xác nhận -> Bấm Confirm -->
<div class="modal fade" id="confirmStoreLevelModal" tabindex="-1" aria-labelledby="confirmStoreLevelModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-serif fw-bold text-dark" id="confirmStoreLevelModalLabel">
                    🏪 Xác Nhận Cấp Bậc Cửa Hàng
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3 text-secondary">
                Bạn có chắc chắn muốn lưu thông tin cấp bậc cửa hàng:
                <div class="alert alert-info py-2 px-3 mt-2 mb-0 fw-bold" id="confirmStoreLevelNameDisplay">
                    Tên cấp bậc
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <!-- Alternative 11d: Bấm nút Cancel -> 12d: Hủy thao tác -->
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelStoreLevel" data-testid="btnCancelStoreLevel">
                    Hủy bỏ
                </button>
                <!-- Bước 11: Bấm nút Confirm -> Bước 12: Thông báo thành công -->
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold text-white" 
                        id="btnConfirmStoreLevel" data-testid="btnConfirmStoreLevel"
                        onclick="document.getElementById('storeLevelForm').submit();">
                    Xác nhận lưu
                </button>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<script>
    function triggerConfirmStoreLevelModal() {
        const nameInput = document.getElementById('storeLevelNameInput');
        const minPointInput = document.getElementById('storeLevelMinPointInput');
        const discountInput = document.getElementById('storeLevelDiscountInput');

        if (!nameInput.value || nameInput.value.trim() === '') {
            nameInput.reportValidity();
            return;
        }
        if (minPointInput.value === '' || minPointInput.value < 0) {
            minPointInput.reportValidity();
            return;
        }
        if (discountInput.value === '' || discountInput.value < 0) {
            discountInput.reportValidity();
            return;
        }

        document.getElementById('confirmStoreLevelNameDisplay').innerText = nameInput.value.trim() + " (" + discountInput.value + "% giảm phí)";
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmStoreLevelModal'));
        confirmModal.show();
    }
</script>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
