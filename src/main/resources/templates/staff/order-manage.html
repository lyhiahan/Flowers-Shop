<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/staff-layout :: assets('Đơn hàng nhân viên')}"></th:block></head>
<body class="staff-page" th:attr="data-staff-store-id=${staffStore != null ? staffStore.id : null}">
<header th:replace="~{fragments/staff-layout :: header(${staffActive})}"></header>
<main class="staff-main">
    <div class="staff-page-heading">
        <div><h1 th:text="${pageTitle}"></h1><p th:text="${staffActive == 'preparation' ? 'Các đơn đã xác nhận và đang chuẩn bị hoa.' : (staffActive == 'delivery' ? 'Bàn giao vận chuyển, giao hoa tại quầy và xác nhận hoàn tất.' : 'Tìm đơn, kiểm tra thông tin giao hàng và mở chi tiết để xử lý.')} "></p></div>
        <span class="staff-status" th:if="${staffStore != null}" th:text="${totalElements + ' đơn hàng'}"></span>
    </div>
    <th:block th:replace="~{fragments/staff-layout :: alerts}"></th:block>
    <th:block th:if="${staffStore != null}">
        <form method="get" th:action="${listPath}" class="staff-card staff-filters">
            <label>Tìm đơn<input name="keyword" th:value="${keyword}" maxlength="100" class="form-control" placeholder="Mã đơn, tên hoặc số điện thoại"></label>
            <label>Trạng thái<select name="status" class="form-select"><option value="">Tất cả trạng thái</option><option th:each="s : ${statusOptions}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s.displayName}"></option></select></label>
            <label>Hình thức nhận hoa<select name="fulfillment" class="form-select"><option value="ALL" th:selected="${fulfillment == 'ALL'}">Tất cả</option><option value="PICKUP" th:selected="${fulfillment == 'PICKUP'}">Nhận tại quầy</option><option value="DELIVERY" th:selected="${fulfillment == 'DELIVERY'}">Giao tận nơi</option></select></label>
            <button class="btn btn-success">Tìm đơn</button><a th:href="${listPath}" class="btn btn-outline-secondary">Xóa lọc</a>
        </form>
        <section class="staff-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0 staff-table">
                    <thead><tr><th>Đơn hàng</th><th>Người nhận</th><th>Giao / nhận hoa</th><th>Thanh toán</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="6" class="text-center py-5 text-muted">Không có đơn hàng phù hợp. Thử thay đổi bộ lọc hoặc kiểm tra trang Đơn hàng.</td></tr>
                        <tr th:each="o : ${orders}">
                            <td><a class="staff-order-link" th:href="@{/staff/orders/{id}(id=${o.id})}" th:text="${'#HD' + o.id}"></a><small class="d-block text-muted mt-1" th:if="${o.createdAt != null}" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></small></td>
                            <td><strong th:text="${o.recipientName ?: o.user.fullName}"></strong><small class="d-block text-muted mt-1" th:text="${o.recipientPhone ?: o.user.phone}"></small></td>
                            <td><span th:text="${o.pickup ? 'Nhận tại quầy' : 'Giao tận nơi'}"></span><small class="d-block text-muted mt-1" th:text="${o.pickup ? staffStore.address : (o.recipientAddress ?: 'Chưa có địa chỉ')}"></small><small class="d-block text-muted" th:if="${o.deliveryDate != null}" th:text="${'Hẹn: ' + #temporals.format(o.deliveryDate, 'dd/MM/yyyy') + (o.deliveryTime != null ? ' · ' + #temporals.format(o.deliveryTime, 'HH:mm') : '')}"></small></td>
                            <td><strong th:text="${#numbers.formatDecimal(o.totalAmount ?: 0, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong><small class="d-block text-muted mt-1" th:text="${o.paymentStatus == 'PAID' ? 'Đã thanh toán' : (o.paymentStatus == 'REFUNDED' ? 'Đã hoàn tiền' : 'Chưa thanh toán')}"></small></td>
                            <td><span class="staff-status" th:text="${o.status.displayName}"></span></td>
                            <td><a class="btn btn-sm btn-outline-success" th:href="@{/staff/orders/{id}(id=${o.id})}">Xem &amp; xử lý</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <nav class="d-flex justify-content-center align-items-center gap-3 mb-3" aria-label="Phân trang đơn hàng" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" class="btn btn-sm btn-outline-success" th:href="@{${listPath}(page=${currentPage - 1},size=${pageSize},keyword=${keyword},status=${selectedStatus},fulfillment=${fulfillment})}">Trang trước</a>
            <span th:text="${'Trang ' + (currentPage + 1) + ' / ' + totalPages}"></span>
            <a th:if="${currentPage + 1 < totalPages}" class="btn btn-sm btn-outline-success" th:href="@{${listPath}(page=${currentPage + 1},size=${pageSize},keyword=${keyword},status=${selectedStatus},fulfillment=${fulfillment})}">Trang sau</a>
        </nav>
        <p class="staff-note">Mở chi tiết đơn để xem hoa cần chuẩn bị, lời chúc, thông tin người nhận và bước xử lý tiếp theo.</p>
    </th:block>
</main>
<th:block th:replace="~{fragments/staff-layout :: scripts}"></th:block>
</body>
</html>
