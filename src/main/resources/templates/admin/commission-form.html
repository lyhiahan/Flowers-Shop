<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: assets(${isEdit ? 'Chính sửa chính sách hoa hồng' : 'Thêm mới chính sách hoa hồng'})}"></th:block>
</head>
<body class="admin-body">
<div class="admin-layout-wrapper">
    <aside th:replace="~{fragments/admin-layout :: sidebar('commissions')}"></aside>
    <main class="main-wrapper-admin">
        <div th:replace="~{fragments/admin-layout :: mobile-topbar(${isEdit ? 'Chỉnh sửa chính sách' : 'Thêm chính sách'})}"></div>
        <div class="p-4">
        <!-- Header & Back button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/commissions}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" style="border-radius: 10px; height: 42px;">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
                <h1 class="admin-page-title mb-0" style="font-size: 24px !important; font-weight: 800; color: #20382E;"
                    th:text="${isEdit ? 'Chỉnh sửa chính sách hoa hồng: ' + commission.name : 'Thêm mới chính sách hoa hồng (New commission)'}">
                    Thêm mới chính sách hoa hồng
                </h1>
            </div>
        </div>

        <!-- Form Card (BƯỚC 6 & 7 THEO UC_035: Hiển thị form thêm mới, nhập đầy đủ thông tin) -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="border: 1px solid #E2E7E2 !important; max-width: 800px;">
            <form id="commissionForm" th:action="${isEdit ? '/admin/commissions/update/' + commission.id : '/admin/commissions/add'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Tên chính sách hoa hồng (*):</label>
                    <input type="text" name="name" id="commissionNameInput" class="form-control" th:value="${commission.name}" 
                           placeholder="VD: Gói Cơ Bản 10%, Gói Đối Tác 8%, Gói Chiến Lược 5%..." 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Mức phí / Tỷ lệ chiết khấu (%) (*):</label>
                    <input type="number" name="cost" id="commissionCostInput" class="form-control" th:value="${commission.cost}" 
                           placeholder="VD: 10, 8, 5..." min="0" step="0.5"
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                    <small class="text-muted">Tỷ lệ phần trăm chiết khấu sàn áp dụng cho các đơn hàng hoàn tất.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Mô tả / Điều kiện áp dụng:</label>
                    <textarea name="description" id="commissionDescInput" class="form-control" rows="3"
                              placeholder="VD: Áp dụng cho các chi nhánh mới tham gia hoặc các đối tác tiêu chuẩn..."
                              style="border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" th:text="${commission.description}"></textarea>
                </div>

                <!-- BƯỚC 8 THEO UC_035: Bấm nút Submit -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/commissions}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        Hủy
                    </a>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold" 
                            id="btnSubmitCommission" data-testid="btnSubmitCommission"
                            onclick="triggerConfirmCommissionModal()"
                            style="border-radius: 10px; background-color: #20382E !important; border-color: #20382E !important;">
                        <i class="bi bi-check2-circle me-1"></i> Submit
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- BƯỚC 9 & 10 THEO UC_035: Hiển thị thông báo yêu cầu xác nhận -> Bấm Confirm -->
<div class="modal fade" id="confirmCommissionModal" tabindex="-1" aria-labelledby="confirmCommissionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-serif fw-bold text-dark" id="confirmCommissionModalLabel">
                    🏷️ Xác Nhận Chính Sách Hoa Hồng
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3 text-secondary">
                Bạn có chắc chắn muốn lưu chính sách hoa hồng:
                <div class="alert alert-info py-2 px-3 mt-2 mb-0 fw-bold" id="confirmCommissionNameDisplay">
                    Tên chính sách
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <!-- Alternative 10d: Bấm nút Cancel -> 11d: Hủy thao tác -->
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelCommission" data-testid="btnCancelCommission">
                    Cancel
                </button>
                <!-- Bước 10: Bấm nút Confirm -> Bước 11: Thông báo thành công -->
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold text-white" 
                        id="btnConfirmCommission" data-testid="btnConfirmCommission"
                        onclick="document.getElementById('commissionForm').submit();">
                    Confirm
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<script>
    function triggerConfirmCommissionModal() {
        const nameInput = document.getElementById('commissionNameInput');
        const costInput = document.getElementById('commissionCostInput');

        if (!nameInput.value || nameInput.value.trim() === '') {
            nameInput.reportValidity();
            return;
        }
        if (costInput.value === '' || costInput.value < 0) {
            costInput.reportValidity();
            return;
        }

        document.getElementById('confirmCommissionNameDisplay').innerText = nameInput.value.trim() + " (" + costInput.value + "%)";
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmCommissionModal'));
        confirmModal.show();
    }
</script>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
