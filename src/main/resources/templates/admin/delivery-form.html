<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/admin-layout :: assets(${isEdit ? 'Chỉnh Sửa Đơn Vị Vận Chuyển' : 'Thêm Mới Đơn Vị Vận Chuyển'} + ' - Quản Trị Hệ Thống Hoa Tươi')}"></th:block>
</head>
<body class="admin-body">
<div class="admin-layout-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/admin-layout :: sidebar('deliveries')}"></aside>

    <!-- Main Content -->
    <main class="main-wrapper-admin">
        <!-- Header & Back button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/admin/deliveries}" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" style="border-radius: 10px; height: 42px;">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
                <h1 class="admin-page-title mb-0" style="font-size: 24px !important; font-weight: 800; color: #20382E;"
                    th:text="${isEdit ? 'Chỉnh sửa đơn vị vận chuyển: ' + delivery.name : 'Thêm mới đơn vị vận chuyển (New delivery unit)'}">
                    Thêm mới đơn vị vận chuyển
                </h1>
            </div>
        </div>

        <!-- Form Card (BƯỚC 6 & 7 THEO UC_034: Hiển thị form thêm mới, nhập đầy đủ thông tin) -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="border: 1px solid #E2E7E2 !important; max-width: 800px;">
            <form id="deliveryForm" th:action="${isEdit ? '/admin/deliveries/update/' + delivery.id : '/admin/deliveries/add'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Tên đơn vị vận chuyển (*):</label>
                    <input type="text" name="name" id="deliveryNameInput" class="form-control" th:value="${delivery.name}" 
                           placeholder="VD: GrabExpress Hỏa Tốc, Giao Hàng Nhanh, Ahamove..." 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Số điện thoại / Hotline hỗ trợ (*):</label>
                    <input type="text" name="phone" id="deliveryPhoneInput" class="form-control" th:value="${delivery.phone}" 
                           placeholder="VD: 028 7108 8810 hoặc 1900 633 677" 
                           style="height: 44px; border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" required>
                    <small class="text-muted">Hotline điều phối và hỗ trợ khách hàng của đơn vị vận chuyển.</small>
                </div>

                <!-- Cước phí được quản lý riêng tại tab Khu vực & Biểu phí -->
                <input type="hidden" name="price" id="deliveryPriceInput" th:value="${delivery.price != null ? delivery.price : 0}">

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #20382E; font-size: 15px;">Mô tả / Phương tiện & Quy cách bảo quản hoa:</label>
                    <textarea name="description" id="deliveryDescInput" class="form-control" rows="3"
                              placeholder="VD: Đội shipper chuyên nghiệp, trang bị thùng giữ ẩm và che chắn cánh hoa cẩn thận."
                              style="border-radius: 10px; border-color: #E2E7E2; font-size: 15px;" th:text="${delivery.description}"></textarea>
                </div>

                <!-- BƯỚC 8 THEO UC_034: Bấm nút Submit -->
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/deliveries}" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 10px;">
                        Hủy
                    </a>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold" 
                            id="btnSubmitDelivery" data-testid="btnSubmitDelivery"
                            onclick="triggerConfirmDeliveryModal()"
                            style="border-radius: 10px; background-color: #20382E !important; border-color: #20382E !important;">
                        <i class="bi bi-check2-circle me-1"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>

    </main>
</div>

<!-- BƯỚC 9 & 10 THEO UC_034: Hiển thị thông báo yêu cầu xác nhận -> Bấm Confirm -->
<div class="modal fade" id="confirmDeliveryModal" tabindex="-1" aria-labelledby="confirmDeliveryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 450px;">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-serif fw-bold text-dark" id="confirmDeliveryModalLabel">
                    🚚 Xác Nhận Đơn Vị Vận Chuyển
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3 text-secondary">
                Bạn có chắc chắn muốn lưu thông tin đơn vị vận chuyển:
                <div class="alert alert-info py-2 px-3 mt-2 mb-0 fw-bold" id="confirmDeliveryNameDisplay">
                    Tên đơn vị vận chuyển
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
                <!-- Alternative 10d: Bấm nút Cancel -> 11d: Hủy thao tác -->
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelDelivery" data-testid="btnCancelDelivery">
                    Hủy bỏ
                </button>
                <!-- Bước 10: Bấm nút Confirm -> Bước 11: Thông báo thành công -->
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-semibold text-white" 
                        id="btnConfirmDelivery" data-testid="btnConfirmDelivery"
                        onclick="document.getElementById('deliveryForm').submit();">
                    Xác nhận lưu
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<script>
    function triggerConfirmDeliveryModal() {
        const nameInput = document.getElementById('deliveryNameInput');
        const phoneInput = document.getElementById('deliveryPhoneInput');

        if (!nameInput.value || nameInput.value.trim() === '') {
            nameInput.reportValidity();
            return;
        }
        if (phoneInput && (!phoneInput.value || phoneInput.value.trim() === '')) {
            phoneInput.reportValidity();
            return;
        }

        const phoneVal = phoneInput ? phoneInput.value.trim() : '';
        document.getElementById('confirmDeliveryNameDisplay').innerText = nameInput.value.trim() + (phoneVal ? " (Hotline: " + phoneVal + ")" : "");
        const confirmModal = new bootstrap.Modal(document.getElementById('confirmDeliveryModal'));
        confirmModal.show();
    }
</script>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
