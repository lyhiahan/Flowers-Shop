<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Mật Khẩu Mới - Chuỗi Cửa Hàng Hoa Tươi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #fef2f2 50%, #fdf2f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .card-box {
            border: 1px solid #ffe4e6;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.1);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-box bg-white p-2">
                <div class="card-body p-4">

                    <!-- Trạng thái 1: Thay đổi thành công (Step 11 & Step 12) -->
                    <div th:if="${isSuccess}">
                        <div class="text-center py-3">
                            <div class="fs-1 text-success mb-2">🎉</div>
                            <h3 class="font-serif fw-bold text-success mb-2">Thay Đổi Thành Công!</h3>
                            <p class="text-muted small mb-4">
                                Mật khẩu mới của bạn đã được cập nhật thành công vào hệ thống.
                            </p>

                            <!-- Step 12: Chọn Back to Login, quay lại trang chủ -->
                            <div class="d-flex flex-column gap-2">
                                <a th:href="@{/login}" id="btnBackToLogin" class="btn btn-danger py-3 rounded-pill fw-bold shadow-sm">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Quay lại Đăng nhập
                                </a>
                                <a th:href="@{/}" id="btnBackToHome" class="btn btn-outline-secondary py-2 rounded-pill fw-semibold mt-1">
                                    <i class="bi bi-house-door me-1"></i> Quay lại trang chủ
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Trạng thái 2: Form tạo mật khẩu mới (Step 8, 9, 10) -->
                    <div th:unless="${isSuccess}">
                        <div class="text-center mb-4">
                            <div class="fs-1 mb-2">🔒</div>
                            <h3 class="font-serif fw-bold text-dark mb-1">Tạo Mật Khẩu Mới</h3>
                            <p class="text-muted small">Nhập mật khẩu mới cho tài khoản của bạn</p>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- Form tạo mật khẩu mới -->
                        <form th:action="@{/reset-password}" method="post">
                            <input type="hidden" name="email" th:value="${email}">
                            <input type="hidden" name="otpCode" th:value="${otpCode}">

                            <!-- Hiển thị tài khoản đang đổi mật khẩu -->
                            <div class="mb-3 p-2 bg-light rounded-3 border d-flex justify-content-between align-items-center">
                                <span class="small text-muted"><i class="bi bi-person-circle me-1"></i> Tài khoản:</span>
                                <span class="small fw-bold text-dark" th:text="${email}">customer@example.com</span>
                            </div>

                            <!-- Nếu không có token/otp từ link email -->
                            <div th:if="${otpCode == null or #strings.isEmpty(otpCode)}" class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Mã xác thực OTP (từ email)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                                    <input type="text" name="otpCode" class="form-control border-start-0 ps-0 text-center fw-bold letter-spacing-2" required maxlength="6" placeholder="Nhập mã 6 chữ số">
                                </div>
                            </div>

                            <!-- Step 9: Nhập mật khẩu mới -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="newPassword" id="newPassword" class="form-control border-start-0 ps-0" required minlength="6" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control border-start-0 ps-0" required minlength="6" placeholder="Nhập lại mật khẩu mới">
                                </div>
                            </div>

                            <!-- Step 10: Bấm Save -->
                            <button type="submit" id="btnSave" class="btn btn-danger w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
                                Lưu mật khẩu
                            </button>
                        </form>

                        <div class="text-center text-muted small">
                            <a th:href="@{/login}" class="text-danger fw-semibold text-decoration-none">Quay lại Đăng nhập</a>
                            <div class="mt-2">
                                <a th:href="@{/}" class="text-secondary text-decoration-none">← Quay lại trang chủ hoa tươi</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
