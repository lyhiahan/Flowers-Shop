<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/floral :: head('Thành viên')}"></head>
<body><header th:replace="~{fragments/floral :: header}"></header>
<main class="container py-4 floral-page"><h1 class="mb-4">Thành viên</h1><div th:replace="~{fragments/floral :: flashes}"></div><form th:action="@{/users}" method="get" class="input-group mb-4"><input name="keyword" class="form-control" th:value="${keyword}" placeholder="Tìm tên hoặc tài khoản" aria-label="Tìm thành viên"><button type="submit" class="btn btn-success">Tìm kiếm</button></form><p th:text="${totalUsers} + ' thành viên'"></p><p th:if="${#lists.isEmpty(users)}">Không tìm thấy thành viên phù hợp.</p><div class="row g-4"><div class="col-12 col-sm-6 col-lg-4" th:each="u : ${users}"><article class="card h-100 p-4"><img th:src="${u.avatarUrl != null and !u.avatarUrl.isEmpty() ? u.avatarUrl : '/images/flower-logo.png'}" class="floral-avatar mb-3" alt="Ảnh đại diện"><h2 class="h5" th:text="${u.fullName != null ? u.fullName : u.username}"></h2><p class="text-muted" th:text="'@' + ${u.username}"></p><a class="btn btn-outline-success mt-auto" th:href="@{/users/{id}(id=${u.id})}">Xem hồ sơ</a></article></div></div><nav th:if="${totalPages > 1}" class="mt-4" aria-label="Phân trang"><ul class="pagination flex-wrap"><li th:each="i : ${#numbers.sequence(0,totalPages-1)}" class="page-item" th:classappend="${i == currentPage} ? 'active'"><a class="page-link" th:href="@{/users(keyword=${keyword},page=${i})}" th:text="${i+1}"></a></li></ul></nav></main>
<footer th:replace="~{fragments/floral :: footer}"></footer><th:block th:replace="~{fragments/floral :: scripts}"></th:block><th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body></html>
