# Isolated from dev/.env: SQL Server credentials must never select this database.
spring.config.import=optional:file:./.env.aiven[.properties]
spring.datasource.url=jdbc:postgresql://${AIVEN_HOST:pg-2679153a-rental-retail-shop.c.aivencloud.com}:${AIVEN_PORT:16325}/${AIVEN_DATABASE:defaultdb}
spring.datasource.username=${AIVEN_USER:avnadmin}
spring.datasource.password=${AIVEN_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${AIVEN_CA_CERT:../ca.pem}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.ApplicationName=flower-shop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.enabled=true
app.demo-data.enabled=false
app.demo-payment.enabled=true
app.demo-payment.auto-tunnel.enabled=${DEMO_PAYMENT_AUTO_TUNNEL_ENABLED:true}
app.demo-payment.base-url=${DEMO_PAYMENT_BASE_URL:}
