<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm - Quản Trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản Lý Sản Phẩm</h2>
        <a th:href="@{/admin/products/create}" class="btn btn-success">+ Thêm Sản Phẩm Mới</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Giá nhập</th>
                    <th>Giá bán</th>
                    <th>Giá thuê/ngày</th>
                    <th>Tiền cọc</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td class="fw-bold" th:text="${p.name}"></td>
                    <td th:text="${p.category.name}"></td>
                    <td th:text="${#numbers.formatDecimal(p.importPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="text-primary fw-bold" th:text="${#numbers.formatDecimal(p.priceBuy, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="text-success" th:text="${#numbers.formatDecimal(p.priceRentPerDay, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="text-warning" th:text="${#numbers.formatDecimal(p.depositFee, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" class="text-center py-4 text-muted">Chưa có sản phẩm nào trong hệ thống.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
