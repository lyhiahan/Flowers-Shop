# Distinct Spring contexts must not create/drop schemas in the same H2 database.
spring.datasource.url=jdbc:h2:mem:flower-tests-${random.uuid};MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.mail.host=localhost
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
app.demo-data.enabled=false
app.demo-payment.enabled=true
spring.session.store-type=none
spring.flyway.enabled=false
app.mail.mock-enabled=true
