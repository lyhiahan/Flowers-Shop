# Standalone PostgreSQL; never imports Aiven or SQL Server credentials.
# Old private-copy defaults remain compatible; the example config uses 5432/flower_shop.
spring.config.import=optional:file:./.env.local-postgres[.properties]
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST:127.0.0.1}:${LOCAL_DB_PORT:15432}/${LOCAL_DB_NAME:flower_local_20261028}
spring.datasource.username=${LOCAL_DB_USER:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.sslmode=disable
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.ApplicationName=flower-shop-local
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.demo-data.enabled=false
app.demo-payment.enabled=true
app.demo-payment.auto-tunnel.enabled=${DEMO_PAYMENT_AUTO_TUNNEL_ENABLED:true}
momo.mode=mock
bank-transfer.mode=mock
