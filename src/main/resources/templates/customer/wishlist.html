<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/floral :: head('Hoa yêu thích')}"></head>
<body><header th:replace="~{fragments/floral :: header}"></header>
<main class="container py-4 floral-page"><h1 class="mb-4">Hoa yêu thích</h1><div th:replace="~{fragments/floral :: flashes}"></div><div class="d-flex flex-wrap gap-2 mb-4"><a class="btn btn-outline-success" th:href="@{/products}">Tiếp tục xem hoa</a><a class="btn btn-outline-secondary" th:href="@{/customer/profile}">Tài khoản</a></div>
<div th:if="${#lists.isEmpty(wishlist)}" class="card p-5 text-center"><p>Chưa có sản phẩm trong danh sách này.</p></div>
<div class="row g-4"><div class="col-12 col-sm-6 col-lg-4" th:each="p : ${wishlist}"><article class="card flower-card h-100 overflow-hidden">
<a th:href="@{/products/{id}(id=${p.id})}"><img class="card-img-top floral-product-image" th:src="${p.imageUrl != null and !p.imageUrl.isEmpty() ? p.imageUrl : '/images/flower-logo.png'}" th:alt="${p.name}" loading="lazy"></a>
<div class="card-body d-flex flex-column"><h2 class="h5"><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h2><p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.sellingPrice,0,'COMMA',0,'POINT')} + ' ₫'"></p><div class="d-flex flex-wrap gap-2 mt-auto"><a class="btn btn-outline-success" th:href="@{/products/{id}(id=${p.id})}">Xem chi tiết</a><form th:if="${p.isActive == true and p.isSelling == true}" th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${p.id}"><input type="hidden" name="quantity" value="1"><input type="hidden" name="orderType" value="BUY"><button class="btn btn-success" type="submit">Thêm giỏ</button></form>
<form th:action="@{/customer/profile/wishlist/toggle/{id}(id=${p.id})}" method="post"><button class="btn btn-outline-danger" type="submit" aria-label="Bỏ yêu thích">Bỏ yêu thích</button></form></div></div></article></div></div></main>
<footer th:replace="~{fragments/floral :: footer}"></footer><th:block th:replace="~{fragments/floral :: scripts}"></th:block></body></html>
