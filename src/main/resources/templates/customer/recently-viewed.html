<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản Phẩm Đã Xem - Chuỗi Cửa Hàng Hoa Tươi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .product-card { border-radius: 16px; border: 1px solid #f1f5f9; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom py-3 sticky-top">
    <div class="container">
        <a class="navbar-brand font-serif fw-bold text-danger fs-4" th:href="@{/}">🌸 HOA TƯƠI SÀI GÒN</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/customer/profile}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-person me-1"></i> Hồ sơ</a>
            <a th:href="@{/cart}" class="btn btn-outline-danger btn-sm"><i class="bi bi-cart me-1"></i> Giỏ hàng</a>
            <a th:href="@{/}" class="btn btn-light btn-sm"><i class="bi bi-house me-1"></i> Trang chủ</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-serif fw-bold mb-1">🕒 Mẫu Hoa Bạn Vừa Xem Gần Đây</h3>
            <p class="text-muted small mb-0">Lịch sử các sản phẩm bạn đã bấm xem chi tiết</p>
        </div>
        <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill btn-sm">Tiếp tục khám phá</a>
    </div>

    <div th:if="${#lists.isEmpty(recentProducts)}" class="text-center py-5 bg-white rounded-4 border p-5">
        <div class="fs-1 text-secondary opacity-50 mb-3">🌿</div>
        <h5>Bạn chưa xem mẫu hoa nào gần đây</h5>
        <p class="text-muted small">Hãy ghé thăm trang chủ để khám phá hàng chục mẫu hoa tuyệt đẹp.</p>
        <a th:href="@{/}" class="btn btn-danger rounded-pill px-4 py-2 mt-2">Xem Ngay</a>
    </div>

    <div th:if="${!#lists.isEmpty(recentProducts)}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="p : ${recentProducts}">
            <div class="card h-100 product-card bg-white p-2">
                <a th:href="@{/products/{id}(id=${p.id})}">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=600'}"
                         class="card-img-top rounded-3" height="220" style="object-fit: cover;" alt="Flower">
                </a>
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <span class="badge bg-danger-subtle text-danger rounded-pill small" th:text="${p.category != null ? p.category.name : 'Hoa tươi'}"></span>
                        <div class="text-warning small"><i class="bi bi-star-fill"></i> <span th:text="${p.rating}">5.0</span></div>
                    </div>
                    <h6 class="card-title fw-bold mb-2">
                        <a th:href="@{/products/{id}(id=${p.id})}" class="text-dark text-decoration-none text-truncate d-block" th:text="${p.name}"></a>
                    </h6>
                    <div class="text-danger fw-bold fs-6 mb-3" th:text="${#numbers.formatDecimal(p.priceBuy, 0, 'COMMA', 0, 'POINT') + ' đ'}"></div>

                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-danger btn-sm rounded-pill w-100">Xem Chi Tiết</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
