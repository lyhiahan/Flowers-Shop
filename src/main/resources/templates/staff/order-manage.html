<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nghiệp Vụ Quầy Nhân Viên - Rental Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-light">
<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Bàn Làm Việc Nhân Viên</h2>
            <p class="text-muted mb-0">Chi nhánh trực: <strong class="text-primary" th:text="${staffStore.name}"></strong></p>
        </div>
        <div>
            <span class="badge bg-success p-2" id="wsStatus">🟢 WebSocket: Đã kết nối</span>
            <a th:href="@{/}" class="btn btn-outline-secondary ms-2">Trang chủ</a>
        </div>
    </div>

    <!-- Alert thông báo realtime qua WebSocket -->
    <div id="realtimeAlert" class="alert alert-info alert-dismissible fade show d-none" role="alert">
        <strong id="alertContent"></strong>
        <button type="button" class="btn-close" onclick="closeAlert()"></button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Loại</th>
                    <th>Tổng tiền</th>
                    <th>Tiền cọc</th>
                    <th>Trạng thái</th>
                    <th>Hành động nghiệp vụ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="fw-bold" th:text="'#' + ${o.id}"></td>
                    <td>
                        <div th:text="${o.user.fullName}"></div>
                        <small class="text-muted" th:text="${o.user.phone}"></small>
                    </td>
                    <td>
                        <span th:if="${o.orderType.name() == 'BUY'}" class="badge bg-primary">MUA</span>
                        <span th:if="${o.orderType.name() == 'RENT'}" class="badge bg-warning text-dark">THUÊ</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${#numbers.formatDecimal(o.totalDeposit, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td>
                        <span class="badge" th:classappend="${o.status.name() == 'PENDING' ? 'bg-secondary' : 
                                                            (o.status.name() == 'CONFIRMED' ? 'bg-info text-dark' : 
                                                            (o.status.name() == 'RENTING' ? 'bg-warning text-dark' : 
                                                            (o.status.name() == 'OVERDUE' ? 'bg-danger' : 
                                                            (o.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-dark'))))}"
                              th:text="${o.status}"></span>
                    </td>
                    <td>
                        <!-- Nút Duyệt đơn khi PENDING -->
                        <form th:if="${o.status.name() == 'PENDING'}" th:action="@{'/staff/orders/approve/' + ${o.id}}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-primary">Duyệt Đơn</button>
                        </form>

                        <!-- Nút Giao hàng / Bàn giao đồ -->
                        <form th:if="${o.status.name() == 'CONFIRMED'}" th:action="@{'/staff/orders/deliver/' + ${o.id}}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-success">Bàn Giao Đồ</button>
                        </form>

                        <!-- Nhận Trả Đồ (cho đơn RENTING hoặc OVERDUE) -->
                        <button th:if="${o.status.name() == 'RENTING' or o.status.name() == 'OVERDUE'}"
                                class="btn btn-sm btn-warning text-dark"
                                th:onclick="'openReturnModal(' + ${o.id} + ')'">
                            Nhận Trả Đồ
                        </button>

                        <!-- Chuyển Mua Đứt khi khách đang thuê -->
                        <form th:if="${o.status.name() == 'RENTING'}" th:action="@{'/staff/orders/convert-to-buy/' + ${o.id}}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-info" onclick="return confirm('Khách muốn mua đứt luôn món này? Hệ thống sẽ khấu trừ tiền cọc đã đóng.')">Mua Đứt</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL NHẬN TRẢ ĐỒ & XỬ LÝ PHẠT/TRẢ CHÉO KHO -->
<div class="modal fade" id="returnModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="returnForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">Quy Trình Kiểm Tra & Nhận Trả Đồ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Chi nhánh tiếp nhận trả đồ (Hỗ trợ trả chéo kho):</label>
                        <select name="returnStoreId" class="form-select" required>
                            <option th:each="s : ${allStores}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == staffStore.id}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tiền bồi thường hư hại đồ (nếu có):</label>
                        <input type="number" name="damageFee" class="form-control" value="0" min="0">
                    </div>

                    <div class="form-check p-3 bg-light rounded border">
                        <input class="form-check-input" type="checkbox" name="waiveFine" value="true" id="waiveFineCheck">
                        <label class="form-check-label text-danger font-weight-bold" for="waiveFineCheck">
                            Miễn giảm toàn bộ tiền phạt trễ hạn (Lý do bất khả kháng: thiên tai, ốm đau)
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Xác Nhận Nhận Đồ & Hoàn Cọc</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var staffStoreId = /*[[${staffStore.id}]]*/ 1;

    function openReturnModal(orderId) {
        var form = document.getElementById('returnForm');
        form.action = '/staff/orders/return/' + orderId;
        var modal = new bootstrap.Modal(document.getElementById('returnModal'));
        modal.show();
    }

    function closeAlert() {
        document.getElementById('realtimeAlert').classList.add('d-none');
    }

    // Kết nối WebSocket STOMP
    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected WebSocket: ' + frame);
        // Lắng nghe kênh đơn hàng của đúng chi nhánh này
        stompClient.subscribe('/topic/store/' + staffStoreId + '/orders', function (message) {
            var alertBox = document.getElementById('realtimeAlert');
            var alertContent = document.getElementById('alertContent');
            alertContent.innerText = "🔔 " + message.body;
            alertBox.classList.remove('d-none');
        });
    }, function(error) {
        document.getElementById('wsStatus').className = "badge bg-danger p-2";
        document.getElementById('wsStatus').innerText = "🔴 WebSocket: Mất kết nối";
    });
    /*]]>*/
</script>
</body>
</html>
