<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="stock(quantity)" class="catalog-stock"
     th:classappend="${salePaused == true ? 'is-sale-paused' : (quantity <= 0 ? 'is-out-of-stock' : '')}">
    <i class="bi" th:classappend="${salePaused == true ? 'bi-pause-circle' : (quantity > 0 ? 'bi-box-seam' : 'bi-x-octagon-fill')}" aria-hidden="true"></i>
    <span th:if="${salePaused == true}">Sản phẩm tạm ngưng bán</span>
    <span th:if="${salePaused != true and quantity > 0}" th:text="${'Còn ' + #numbers.formatInteger(quantity, 1, 'POINT') + ' sản phẩm'}"></span>
    <span th:if="${salePaused != true and quantity <= 0}">Hết hàng</span>
</div>
</body>
</html>
