<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: assets('Quản Lý Mẫu Hoa & Phụ Kiện - Quản Trị Hệ Thống Hoa Tươi')}">
</head>
<body class="admin-body">

<div class="admin-layout-wrapper">
    <!-- Sidebar thống nhất chuẩn Quản trị viên -->
    <aside th:replace="~{fragments/admin-layout :: sidebar('products')}"></aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper d-flex flex-column">
        <!-- TOP NAVBAR -->
        <header class="top-navbar d-flex justify-content-between align-items-center sticky-top">
            <div>
                <h1 class="admin-page-title mb-0">Quản Lý Danh Mục Sản Phẩm</h1>
                <small class="text-muted" style="font-size: 15px;">Kiểm soát giá cả và danh mục hoa tươi</small>
            </div>
            <div>
                <a th:href="@{/admin/products/create}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm fw-bold">
                    <i class="bi bi-plus-lg"></i> Thêm Sản Phẩm Mới
                </a>
            </div>
        </header>

        <!-- BODY -->
        <main class="p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Giá Nhập Gốc</th>
                            <th>Giá Bán</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td class="text-muted fw-bold" th:text="'#' + ${p.id}"></td>
                            <td class="fw-bold text-dark" th:text="${p.name}"></td>
                            <td><span class="badge bg-secondary" th:text="${p.category.name}"></span></td>
                            <td class="text-muted" th:text="${#numbers.formatDecimal(p.importPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="text-primary fw-bold" th:text="${#numbers.formatDecimal(p.priceBuy, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="5" class="text-center py-4 text-muted">Chưa có sản phẩm nào trong hệ thống.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: footer}"></th:block>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
