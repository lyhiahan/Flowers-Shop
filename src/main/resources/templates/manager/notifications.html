<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông Báo Cửa Hàng - Quản Lý Tiệm Hoa</title>
    <th:block th:replace="~{fragments/manager-layout :: assets}"></th:block>
    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/manager-layout.css}">
    <style>
        :root {
            --bg-page: #FFF0F3;
            --surface-card: #FFFFFF;
            --brand-green: #20382E;
            --brand-green-light: #E5EEE8;
            --primary-green: #355447;
            --border-soft: #E7DED4;
        }

        body {
            font-family: 'Nunito', sans-serif !important;
            background-color: var(--bg-page) !important;
            color: var(--brand-green);
            min-height: 100vh;
        }

        .notif-card-manager {
            background: #FFFFFF;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 18px 22px;
            transition: all 0.2s ease;
            position: relative;
        }

        .notif-card-manager:hover {
            border-color: #A3B8AD;
            box-shadow: 0 4px 14px rgba(32, 56, 46, 0.06);
        }

        .notif-card-manager.unread {
            background-color: #F8FAF9;
            border-left: 5px solid var(--primary-green);
        }

        .notif-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .btn-action-primary {
            background: #355447;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            height: 38px;
            padding: 0 16px;
            font-weight: 700;
            font-size: 13.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-action-primary:hover {
            background: #20382E;
            color: #FFFFFF;
        }

        .notif-fade-in {
            animation: fadeInHighlight 1.5s ease-out;
        }

        @keyframes fadeInHighlight {
            0% { background-color: #E6F4EA; transform: translateY(-8px); opacity: 0; }
            50% { background-color: #E6F4EA; }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="manager-page">
<header th:replace="~{fragments/manager-layout :: mobileHeader}"></header>

<div class="manager-layout">
    <aside th:replace="~{fragments/manager-layout :: sidebar('notifications')}"></aside>
    
    <main id="managerMain" class="manager-main dashboard-main">
        <!-- Header thông báo -->
        <header class="d-flex justify-content-between align-items-start flex-wrap gap-3 pb-3 mb-4 border-bottom">
            <div>
                <h1 class="h3 fw-bold mb-1" style="color: var(--brand-green);">Trung Tâm Thông Báo</h1>
                <p class="text-muted mb-0 small">
                    Chi nhánh: <strong class="text-dark" th:text="${managerStore != null ? managerStore.name : 'Tất cả chi nhánh'}">Tên chi nhánh</strong>
                    <span class="mx-2">•</span>
                    Chưa đọc: <span id="unreadCountDisplay" class="badge rounded-pill bg-danger" th:text="${unreadCount}">0</span>
                </p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button th:if="${unreadCount > 0}" id="pageMarkAllReadBtn" onclick="markAllNotificationsRead(this)" class="btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm">
                    <i class="bi bi-check2-all me-1"></i> Đánh dấu đã đọc tất cả
                </button>
                <a th:href="@{/manager/orders}" class="btn btn-sm btn-action-primary">
                    <i class="bi bi-bag-check me-1"></i> Quản lý đơn hàng
                </a>
            </div>
        </header>

        <!-- Empty state khi không có thông báo -->
        <div id="emptyNotifAlert" th:classappend="${#lists.isEmpty(notifications)} ? '' : 'd-none'" class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
            <div class="fs-1 mb-2 text-secondary opacity-50"><i class="bi bi-bell-slash"></i></div>
            <h5 class="fw-bold text-dark">Chưa có thông báo nào</h5>
            <p class="text-muted small mb-3">Mọi thông báo về đơn hàng mới, cập nhật ví và cảnh báo hoạt động của chi nhánh sẽ hiển thị tại đây.</p>
            <div>
                <a th:href="@{/manager/dashboard}" class="btn btn-sm btn-action-primary rounded-pill px-4">Về bảng điều khiển</a>
            </div>
        </div>

        <!-- Danh sách thông báo -->
        <div id="notificationsList" th:classappend="${#lists.isEmpty(notifications)} ? 'd-none' : ''" class="d-flex flex-column gap-3">
            <div th:each="n : ${notifications}" 
                 class="notif-card-manager" 
                 th:classappend="${!n.isRead} ? 'unread' : ''"
                 th:id="'notif_' + ${n.id}">
                <div class="d-flex align-items-start gap-3">
                    <!-- Icon theo loại thông báo -->
                    <div class="notif-icon-circle" 
                         th:style="${n.type == 'ORDER_CREATED'} ? 'background-color: #ECFDF5; color: #059669;' : 
                                    (${n.type == 'ORDER_DELIVERED' or n.type == 'ORDER_CONFIRMED'} ? 'background-color: #E0F2FE; color: #0284C7;' : 
                                    (${n.type == 'ORDER_CANCELLED'} ? 'background-color: #FEE2E2; color: #DC2626;' : 
                                    (${n.type == 'WALLET_DEPOSIT' or n.type == 'WALLET_WITHDRAW'} ? 'background-color: #FEF3C7; color: #D97706;' : 'background-color: #E5EEE8; color: #20382E;')))">
                        <i th:class="${n.type == 'ORDER_CREATED'} ? 'bi bi-bag-plus-fill' : 
                                    (${n.type == 'ORDER_DELIVERED' or n.type == 'ORDER_CONFIRMED'} ? 'bi bi-flower1' : 
                                    (${n.type == 'ORDER_CANCELLED'} ? 'bi bi-x-circle-fill' : 
                                    (${n.type == 'WALLET_DEPOSIT' or n.type == 'WALLET_WITHDRAW'} ? 'bi bi-coin' : 'bi bi-bell-fill')))"></i>
                    </div>

                    <!-- Nội dung -->
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-baseline mb-1">
                            <h6 class="fw-bold text-dark mb-0" th:text="${n.title}">Tiêu đề thông báo</h6>
                            <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</small>
                        </div>
                        <p class="text-secondary small mb-2" th:text="${n.content}">Nội dung chi tiết thông báo.</p>
                        
                        <div class="d-flex align-items-center gap-3">
                            <a th:if="${n.relatedOrderId != null}" 
                               th:href="@{'/manager/orders/' + ${n.relatedOrderId}}" 
                               onclick="markNotificationReadDirect(this)"
                               th:data-id="${n.id}"
                               class="btn btn-sm btn-outline-success rounded-pill px-3 fw-semibold" style="font-size: 12.5px;">
                                Xem đơn hàng #<span th:text="${n.relatedOrderId}"></span> <i class="bi bi-arrow-right ms-1"></i>
                            </a>
                            <button th:if="${!n.isRead}" 
                                    onclick="markSingleNotificationRead(this)" 
                                    th:data-id="${n.id}" 
                                    class="btn btn-link btn-sm text-muted p-0 text-decoration-none" style="font-size: 12.5px;">
                                <i class="bi bi-check2"></i> Đánh dấu đã đọc
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/manager-layout :: footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/js/notifications-realtime.js}"></script>

<script>
    async function markSingleNotificationRead(btn) {
        if (btn.disabled) return;
        btn.disabled = true;
        const id = btn.getAttribute('data-id');
        try {
            await window.FlowerShopNotif?.readNotification(id);
            const card = document.getElementById('notif_' + id);
            if (card) {
                card.classList.remove('unread');
                btn.remove();
            }
        } catch (error) {
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }

    function markNotificationReadDirect(link) {
        const id = link.getAttribute('data-id');
        if (id && window.FlowerShopNotif) {
            window.FlowerShopNotif.readNotification(id).catch(e => console.warn(e));
        }
    }

    async function markAllNotificationsRead(btn) {
        if (btn.disabled) return;
        btn.disabled = true;
        try {
            await window.FlowerShopNotif?.readAllNotifications();
            document.querySelectorAll('.notif-card-manager.unread').forEach(el => el.classList.remove('unread'));
            document.querySelectorAll('#notificationsList button[onclick*="markSingleNotificationRead"]').forEach(el => el.remove());
            btn.remove();
        } catch (error) {
            alert('Không thể đánh dấu đã đọc: ' + error.message);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
