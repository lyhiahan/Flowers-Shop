<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/floral :: head('Cửa hàng đang theo dõi')}"></head>
<body><header th:replace="~{fragments/floral :: header}"></header>
<main class="container py-4 floral-page"><h1 class="mb-4">Cửa hàng đang theo dõi</h1><div th:replace="~{fragments/floral :: flashes}"></div><a class="btn btn-outline-success mb-4" th:href="@{/stores}">Khám phá cửa hàng</a><div th:if="${#lists.isEmpty(followedStores)}" class="card p-5 text-center">Bạn chưa theo dõi cửa hàng nào.</div><div class="row g-4"><div class="col-12 col-md-6 col-lg-4" th:each="s : ${followedStores}"><article class="card h-100"><img th:if="${s.cover != null}" th:src="${s.cover}" class="card-img-top floral-product-image" th:alt="${s.name}"><div class="card-body"><h2 class="h5" th:text="${s.name}"></h2><p th:text="${s.address}"></p><div class="d-flex flex-wrap gap-2"><a class="btn btn-success" th:href="@{/stores/{id}(id=${s.id})}">Xem cửa hàng</a><form th:action="@{/customer/profile/store/follow/{id}(id=${s.id})}" method="post"><button type="submit" class="btn btn-outline-danger">Bỏ theo dõi</button></form></div></div></article></div></div></main>
<footer th:replace="~{fragments/floral :: footer}"></footer><th:block th:replace="~{fragments/floral :: scripts}"></th:block></body></html>
