<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="assets(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' - Hoa Tươi Sài Gòn'}"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
    <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
    <link rel="stylesheet" th:href="@{/css/staff-workspace.css(v='sidebar-1')}">
</th:block>
</head>
<body>
<th:block th:fragment="header(active)">
    <header class="staff-mobile-header">
        <a th:href="@{/staff/orders}" class="staff-mobile-brand">HOA TƯƠI SÀI GÒN</a>
        <button id="staffMenuToggle" type="button" class="btn btn-outline-success" aria-controls="staffSidebar" aria-expanded="false" aria-label="Mở điều hướng nhân viên"><i class="bi bi-list" aria-hidden="true"></i></button>
    </header>
    <aside id="staffSidebar" class="staff-sidebar" aria-label="Khu vực nhân viên">
        <div class="staff-sidebar-brand">
            <a th:href="@{/staff/orders}" class="staff-nav-brand">
                <img th:src="@{/images/flower-logo.png}" alt="" width="38" height="38">
                <div><strong>HOA TƯƠI SÀI GÒN</strong><small>Nhân viên cửa hàng</small></div>
            </a>
            <p class="staff-branch" th:if="${staffStore != null}" th:text="${staffStore.name}"></p>
            <button id="staffMenuClose" class="staff-sidebar-close" type="button" aria-label="Đóng điều hướng nhân viên"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </div>
        <nav class="staff-navigation" aria-label="Chức năng nhân viên">
            <a id="staffNavOrders" th:href="@{/staff/orders}" th:attr="aria-current=${active == 'orders' ? 'page' : null}"><i class="bi bi-receipt" aria-hidden="true"></i>Đơn hàng</a>
            <a id="staffNavPreparation" th:href="@{/staff/orders/preparation}" th:attr="aria-current=${active == 'preparation' ? 'page' : null}"><i class="bi bi-flower1" aria-hidden="true"></i>Chuẩn bị hoa</a>
            <a id="staffNavDelivery" th:href="@{/staff/orders/delivery}" th:attr="aria-current=${active == 'delivery' ? 'page' : null}"><i class="bi bi-truck" aria-hidden="true"></i>Giao &amp; nhận hoa</a>
            <a id="staffNavChat" th:href="@{/staff/chat}" th:attr="aria-current=${active == 'chat' ? 'page' : null}"><i class="bi bi-chat-dots" aria-hidden="true"></i>Tin nhắn khách hàng</a>
        </nav>
        <div class="staff-sidebar-footer">
            <div class="staff-identity"><i class="bi bi-person-circle" aria-hidden="true"></i><span th:text="${staffUser != null ? staffUser.fullName : 'Nhân viên'}"></span></div>
            <small>Bàn làm việc nhân viên</small>
            <form th:action="@{/logout}" method="post"><button class="staff-logout" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Đăng xuất</button></form>
        </div>
    </aside>
    <button id="staffMenuBackdrop" class="staff-sidebar-backdrop" type="button" aria-label="Đóng điều hướng nhân viên" hidden></button>
</th:block>
<th:block th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
    <div th:if="${staffStore == null}" class="alert alert-warning">Bạn chưa được phân công chi nhánh hoặc phân công đã bị thu hồi. Vui lòng liên hệ quản lý.</div>
    <div th:if="${staffStore != null}" id="staffOrderUpdates" class="alert alert-info staff-live-banner" role="status" hidden>Có cập nhật đơn hàng tại chi nhánh. <a href="" class="alert-link">Tải lại dữ liệu</a></div>
</th:block>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:if="${staffStore != null}">
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <th:block th:if="${chatWorkbench != true}"><th:block th:replace="~{fragments/chat-widget :: widget}"></th:block></th:block>
    </th:block>
    <script th:src="@{/js/staff-workspace.js(v='sidebar-1')}" defer></script>
</th:block>
</body>
</html>
