<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Báo Cáo Doanh Thu Chi Nhánh - Quản Lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Báo Cáo Doanh Thu Chi Nhánh</h2>
            <p class="text-muted">Cơ sở: <strong class="text-primary" th:text="${store.name}"></strong> - Địa chỉ: <span th:text="${store.address}"></span></p>
        </div>
        <a th:href="@{/}" class="btn btn-secondary">Về Trang Chủ</a>
    </div>

    <!-- Hàng thẻ thống kê tổng quan số tiền -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 border-start border-primary border-4 p-3">
                <h6 class="text-muted">DOANH THU MUA ĐỨT</h6>
                <h3 class="text-primary" th:text="${#numbers.formatDecimal(stats.totalBuyRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 border-start border-warning border-4 p-3">
                <h6 class="text-muted">DOANH THU CHO THUÊ</h6>
                <h3 class="text-warning" th:text="${#numbers.formatDecimal(stats.totalRentRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0 border-start border-danger border-4 p-3">
                <h6 class="text-muted">TIỀN PHẠT PHÁT SINH</h6>
                <h3 class="text-danger" th:text="${#numbers.formatDecimal(stats.totalFineRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
            </div>
        </div>
    </div>

    <!-- Biểu đồ Chart.js so sánh tỷ trọng -->
    <div class="row">
        <div class="col-md-7">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="mb-3">Biểu Đồ So Sánh Tỷ Trọng Doanh Thu</h5>
                <canvas id="revenueBarChart" height="200"></canvas>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="mb-3">Cơ Cấu Nguồn Thu</h5>
                <canvas id="revenuePieChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var buyRev = /*[[${stats.totalBuyRevenue}]]*/ 0;
    var rentRev = /*[[${stats.totalRentRevenue}]]*/ 0;
    var fineRev = /*[[${stats.totalFineRevenue}]]*/ 0;

    // 1. Biểu đồ Cột
    new Chart(document.getElementById('revenueBarChart'), {
        type: 'bar',
        data: {
            labels: ['Mảng Mua Đứt', 'Mảng Cho Thuê', 'Khoản Phạt'],
            datasets: [{
                label: 'Doanh thu (VNĐ)',
                data: [buyRev, rentRev, fineRev],
                backgroundColor: ['#0d6efd', '#ffc107', '#dc3545']
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } }
        }
    });

    // 2. Biểu đồ Tròn
    new Chart(document.getElementById('revenuePieChart'), {
        type: 'doughnut',
        data: {
            labels: ['Mua Đứt', 'Thuê Đồ', 'Tiền Phạt'],
            datasets: [{
                data: [buyRev, rentRev, fineRev],
                backgroundColor: ['#0d6efd', '#ffc107', '#dc3545']
            }]
        }
    });
    /*]]>*/
</script>
</body>
</html>
