<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - Bloom Flower Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="fs-1 mb-2">🌸</div>
                        <h3 class="fw-bold text-dark">BLOOM FLOWER</h3>
                        <p class="text-muted small">Đăng ký tài khoản khách hàng mới</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tên đăng nhập (*)</label>
                                <input type="text" th:field="*{username}" class="form-control"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                       placeholder="Từ 4-50 ký tự" required>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mật khẩu (*)</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Tối thiểu 6 ký tự" required>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên (*)</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Nguyễn Văn A" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email (*)</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="email@example.com" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                            <div class="form-text text-muted small">Mã OTP kích hoạt tài khoản sẽ được gửi đến email này.</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="0901234567">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Địa chỉ</label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="Quận/Huyện, Tỉnh/TP">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Đăng Ký & Nhận Mã OTP</button>
                    </form>

                    <div class="text-center text-muted small">
                        Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập ngay</a>
                        <div class="mt-2">
                            <a th:href="@{/}" class="text-secondary text-decoration-none">← Quay lại trang chủ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
