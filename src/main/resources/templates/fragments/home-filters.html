<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div class="offcanvas offcanvas-end" tabindex="-1" id="allFiltersOffcanvas" aria-labelledby="allFiltersOffcanvasLabel" style="width: 420px; max-width: 90vw;" th:fragment="filters">
        <div class="offcanvas-header border-bottom py-3 px-4" style="background-color: #FAF7F2;">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-sliders" style="font-size: 18px; color: #20382E !important;"></i>
                <h5 class="offcanvas-title fw-bold mb-0" id="allFiltersOffcanvasLabel" style="color: #20382E; font-size: 18px;">Tất cả bộ lọc</h5>
            </div>
            <button type="button" class="btn-close text-reset shadow-none" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
        </div>
        <div class="offcanvas-body p-4" style="overflow-y: auto;">
            <div class="mb-4" id="filterGroupStore">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Chi nhánh</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="drawer-filter-chip" data-store-id="" aria-pressed="false">
                        <span class="chip-check">✓</span>Tất cả chi nhánh
                    </button>
                    <button th:each="branch : ${catalogStores}" type="button" class="drawer-filter-chip"
                            th:attr="data-store-id=${branch.id}" aria-pressed="false">
                        <span class="chip-check">✓</span><span th:text="${branch.name}"></span>
                    </button>
                </div>
            </div>

            <!-- Nhóm 1: Kiểu dáng (Bó hoa, Giỏ hoa, Hộp hoa, Bình hoa, Chậu hoa, Kệ hoa...) -->
            <div class="mb-4" id="filterGroupStyle">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Kiểu dáng</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Bó hoa"><span class="chip-check">✓</span>Bó hoa</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Giỏ hoa"><span class="chip-check">✓</span>Giỏ hoa</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Hộp hoa"><span class="chip-check">✓</span>Hộp hoa</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Bình hoa"><span class="chip-check">✓</span>Bình hoa</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Chậu hoa"><span class="chip-check">✓</span>Chậu hoa</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerStyle" data-val="Kệ hoa"><span class="chip-check">✓</span>Kệ hoa</button>
                </div>
            </div>

            <!-- Nhóm 2: Loại hoa (Hoa hồng, Tulip, Hướng dương, Cẩm tú cầu, Lan hồ điệp, Calla Lily, Baby...) -->
            <div class="mb-4" id="filterGroupType">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Loại hoa</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Hoa hồng"><span class="chip-check">✓</span>Hoa hồng</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Tulip"><span class="chip-check">✓</span>Tulip</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Hướng dương"><span class="chip-check">✓</span>Hướng dương</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Cẩm tú cầu"><span class="chip-check">✓</span>Cẩm tú cầu</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Lan hồ điệp"><span class="chip-check">✓</span>Lan hồ điệp</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Calla Lily"><span class="chip-check">✓</span>Calla Lily</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerType" data-val="Baby"><span class="chip-check">✓</span>Hoa Baby</button>
                </div>
            </div>

            <!-- Nhóm 3: Màu sắc (Đỏ, Hồng, Vàng, Trắng, Tím, Xanh, Cam) -->
            <div class="mb-4" id="filterGroupColor">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Màu sắc</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Đỏ">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #E53E3E;"></span> Đỏ
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Hồng">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #ED64A6;"></span> Hồng
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Vàng">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #ECC94B;"></span> Vàng
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Trắng">
                        <span class="chip-check">✓</span><span class="color-dot border" style="background-color: #FFFFFF;"></span> Trắng
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Tím">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #9F7AEA;"></span> Tím
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Xanh">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #4299E1;"></span> Xanh
                    </button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerColor" data-val="Cam">
                        <span class="chip-check">✓</span><span class="color-dot" style="background-color: #ED8936;"></span> Cam
                    </button>
                </div>
            </div>

            <!-- Nhóm 4: Dịp tặng (Sinh nhật, Tốt nghiệp, Khai trương, Tình yêu, Chúc mừng, Đám cưới, Chia buồn...) -->
            <div class="mb-4" id="filterGroupOccasion">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Dịp tặng</div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Sinh nhật"><span class="chip-check">✓</span>Sinh nhật</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Tốt nghiệp"><span class="chip-check">✓</span>Tốt nghiệp</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Khai trương"><span class="chip-check">✓</span>Khai trương</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Tình yêu"><span class="chip-check">✓</span>Tình yêu</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Chúc mừng"><span class="chip-check">✓</span>Chúc mừng</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Đám cưới"><span class="chip-check">✓</span>Đám cưới</button>
                    <button type="button" class="drawer-filter-chip" data-group="flowerOccasion" data-val="Chia buồn"><span class="chip-check">✓</span>Chia buồn</button>
                </div>
            </div>

            <!-- Nhóm 5: Giá (Khoảng giá có sẵn hoặc nhập từ - đến) -->
            <div class="mb-3" id="filterGroupPrice">
                <div class="fw-bold mb-2 text-dark" style="font-size: 15px;">Khoảng giá</div>
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button type="button" class="drawer-filter-chip drawer-price-chip" data-min="" data-max="300000"><span class="chip-check">✓</span>Dưới 300.000 ₫</button>
                    <button type="button" class="drawer-filter-chip drawer-price-chip" data-min="300000" data-max="600000"><span class="chip-check">✓</span>300.000 – 600.000 ₫</button>
                    <button type="button" class="drawer-filter-chip drawer-price-chip" data-min="600000" data-max="1000000"><span class="chip-check">✓</span>600.000 – 1.000.000 ₫</button>
                    <button type="button" class="drawer-filter-chip drawer-price-chip" data-min="1000000" data-max="2000000"><span class="chip-check">✓</span>1.000.000 – 2.000.000 ₫</button>
                    <button type="button" class="drawer-filter-chip drawer-price-chip" data-min="2000000" data-max=""><span class="chip-check">✓</span>Trên 2.000.000 ₫</button>
                </div>

                <div class="small fw-semibold text-secondary mb-1">Hoặc nhập khoảng giá (VNĐ):</div>
                <div class="row g-2 align-items-center">
                    <div class="col-5">
                        <input type="number" id="drawerMinPrice" class="form-control form-control-sm rounded-pill px-3" placeholder="Từ (₫)">
                    </div>
                    <div class="col-2 text-center text-muted small">—</div>
                    <div class="col-5">
                        <input type="number" id="drawerMaxPrice" class="form-control form-control-sm rounded-pill px-3" placeholder="Đến (₫)">
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer cuối bảng (sticky): [Đặt lại] & [✓ Áp dụng] -->
        <div class="offcanvas-footer border-top bg-white d-flex align-items-center justify-content-between gap-3"
             style="padding: 14px 20px; position: sticky; bottom: 0; z-index: 5; box-shadow: 0 -4px 16px rgba(41,59,50,0.08);">
            <button type="button" id="btnDrawerReset"
               class="btn btn-outline-secondary rounded-pill px-3 py-2 fw-semibold flex-1"
               style="font-size: 14px; flex: 1;">
                Đặt lại
            </button>
            <button type="button" id="btnDrawerApply"
                    class="btn rounded-pill px-3 py-2 fw-bold text-white flex-1"
                    style="background-color: #20382E; font-size: 14px; flex: 1;">
                <i class="bi bi-check2 me-1"></i>Áp dụng
            </button>
        </div>
    </div>
</body>
</html>
