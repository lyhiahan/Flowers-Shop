<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cửa Hàng Đang Theo Dõi - Bloom Flower Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .store-card { border-radius: 16px; border: 1px solid #f1f5f9; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom py-3 sticky-top">
    <div class="container">
        <a class="navbar-brand font-serif fw-bold text-danger fs-4" th:href="@{/}">🌸 BLOOM FLOWER</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/customer/profile}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-person me-1"></i> Hồ sơ</a>
            <a th:href="@{/}" class="btn btn-light btn-sm"><i class="bi bi-house me-1"></i> Trang chủ</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-serif fw-bold mb-1">🏪 Chi Nhánh & Shop Đang Theo Dõi</h3>
            <p class="text-muted small mb-0">Các chi nhánh trong chuỗi hoa tươi bạn quan tâm</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(followedStores)}" class="text-center py-5 bg-white rounded-4 border p-5">
        <div class="fs-1 text-secondary opacity-50 mb-3">🏢</div>
        <h5>Bạn chưa theo dõi cửa hàng nào</h5>
        <p class="text-muted small">Hãy bấm theo dõi các chi nhánh shop hoa để nhận tin tức khuyến mãi mới nhất.</p>
        <a th:href="@{/}" class="btn btn-danger rounded-pill px-4 py-2 mt-2">Dạo Chuỗi Cửa Hàng</a>
    </div>

    <div th:if="${!#lists.isEmpty(followedStores)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="s : ${followedStores}">
            <div class="card h-100 store-card bg-white p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <img th:src="${s.avatar != null ? s.avatar : 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=100'}"
                         class="rounded-circle border" width="60" height="60" style="object-fit: cover;">
                    <div>
                        <h6 class="fw-bold mb-0 font-serif" th:text="${s.name}"></h6>
                        <span class="badge bg-success-subtle text-success rounded-pill small">Đang Hoạt Động</span>
                    </div>
                </div>
                <p class="text-muted small mb-2"><i class="bi bi-geo-alt text-danger me-1"></i> <span th:text="${s.address}"></span></p>
                <p class="text-muted small mb-4"><i class="bi bi-telephone text-primary me-1"></i> Hotline: <span th:text="${s.phone}"></span></p>

                <div class="d-flex gap-2 mt-auto">
                    <a th:href="@{/stores/{id}(id=${s.id})}" class="btn btn-outline-danger btn-sm rounded-pill flex-fill">Tham Quan Cửa Hàng</a>
                    <form th:action="@{/customer/profile/store/follow/{id}(id=${s.id})}" method="post">
                        <button type="submit" class="btn btn-outline-secondary btn-sm rounded-pill">Bỏ theo dõi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
