<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<title>Báo Cáo Doanh Thu Shop - Chuỗi Cửa Hàng Hoa Tươi</title>
<th:block th:replace="~{fragments/manager-layout :: assets}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-page); color: var(--text-main); }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }




    </style>
<link rel="stylesheet" th:href="@{/css/manager-layout.css}">
</head>
<body class="manager-page">
<header th:replace="~{fragments/manager-layout :: mobileHeader}"></header>
<div class="manager-layout">
    <aside th:replace="~{fragments/manager-layout :: sidebar('analytics')}"></aside>
    <main id="managerMain" class="manager-main">

            <!-- 1. Header: Rút gọn tiêu đề chuẩn hóa -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="admin-page-title mb-0">Báo cáo doanh thu</h1>
                    <p class="mb-0 mt-1" style="font-size: 16px; color: #66736B;">Thống kê doanh thu theo sản phẩm và đơn hàng của chi nhánh.</p>
                </div>

                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <!-- Filter Theo Đơn Hàng / Sản Phẩm -->
                    <div class="btn-group shadow-sm bg-white p-1 rounded-pill" style="border: 1px solid #D1E5DA;">
                        <a th:href="@{/manager/analytics(type='order', timeframe=${timeframe})}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${type == 'order' or type == null} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo đơn hàng</a>
                        <a th:href="@{/manager/analytics(type='product')}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${type == 'product'} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo sản phẩm</a>
                    </div>

                    <!-- Timeframe Selector (Khi xem theo đơn hàng) -->
                    <div th:if="${type == 'order' or type == null}" class="btn-group shadow-sm bg-white p-1 rounded-pill" style="border: 1px solid #D1E5DA;">
                        <a th:href="@{/manager/analytics(type='order', timeframe='hour')}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${timeframe == 'hour'} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo giờ</a>
                        <a th:href="@{/manager/analytics(type='order', timeframe='day')}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${timeframe == 'day' or timeframe == null} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo ngày</a>
                        <a th:href="@{/manager/analytics(type='order', timeframe='month')}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${timeframe == 'month'} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo tháng</a>
                        <a th:href="@{/manager/analytics(type='order', timeframe='year')}" class="btn btn-sm rounded-pill px-3 fw-semibold"
                           th:style="${timeframe == 'year'} ? 'background-color: #20382E; color: #FFFFFF;' : 'color: #20382E; background: transparent;'">Theo năm</a>
                    </div>
                </div>
            </div>

            <!-- Charts Grid (Cột & Đường & Tròn) -->
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="font-serif fw-bold mb-0">
                                📈 Biểu Đồ Doanh Thu
                                <span class="small text-muted fw-normal" th:text="${type == 'product' ? '(Theo Sản Phẩm Hoa)' : '(Theo Đơn Hàng)'}"></span>
                            </h5>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-secondary active" id="btnBar" onclick="switchChart('bar')">Cột</button>
                                <button type="button" class="btn btn-outline-secondary" id="btnLine" onclick="switchChart('line')">Đường</button>
                                <button type="button" class="btn btn-outline-secondary" id="btnPie" onclick="switchChart('pie')">Tròn</button>
                            </div>
                        </div>
                        <canvas id="mainRevenueChart" height="220"></canvas>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                        <h5 class="font-serif fw-bold mb-3">🍩 Tỷ Trọng Phân Bố (Biểu đồ Tròn)</h5>
                        <canvas id="doughnutChart" height="260"></canvas>
                    </div>
                </div>
            </div>

    </main>
</div>

<th:block th:replace="~{fragments/manager-layout :: footer}"></th:block>
<script th:inline="javascript">
    /*<![CDATA[*/
    var chartData = /*[[${revenueChart}]]*/ {};
    var labels = (chartData && chartData.labels) ? chartData.labels : ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
    var values = (chartData && chartData.data) ? chartData.data : [1200000, 2400000, 1800000, 3200000, 4500000, 6800000, 5200000];

    var ctx = document.getElementById('mainRevenueChart').getContext('2d');
    var currentChartType = 'bar';
    var mainChart = new Chart(ctx, {
        type: currentChartType,
        data: {
            labels: labels,
            datasets: [{
                label: 'Doanh thu (VNĐ)',
                data: values,
                backgroundColor: ['#355447', '#79B7A1', '#A64060', '#E9AD4A', '#78A7D2', '#C4A8DF', '#DB8580'],
                borderColor: '#355447',
                borderWidth: 2,
                borderRadius: 8,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString() + ' đ'; }
                    }
                }
            }
        }
    });

    // Doughnut chart
    new Chart(document.getElementById('doughnutChart').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: ['#355447', '#79B7A1', '#A64060', '#E9AD4A', '#78A7D2', '#C4A8DF', '#DB8580']
            }]
        },
        options: { responsive: true }
    });

    function switchChart(type) {
        document.getElementById('btnBar').classList.toggle('active', type === 'bar');
        document.getElementById('btnLine').classList.toggle('active', type === 'line');
        document.getElementById('btnPie').classList.toggle('active', type === 'pie');
        mainChart.config.type = type;
        if (type === 'pie') {
            mainChart.options.scales = {};
        } else {
            mainChart.options.scales = {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString() + ' đ'; }
                    }
                }
            };
        }
        mainChart.update();
    }
    /*]]>*/
</script>
<script th:src="@{/js/global-modal.js}"></script>
</body>
</html>
