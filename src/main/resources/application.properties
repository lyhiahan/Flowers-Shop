spring.application.name=finalproject
# Local secrets (Java properties syntax); real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# Server port
server.port=8080
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
spring.mvc.welcome-page.enabled=false
server.error.include-message=always
server.error.include-stacktrace=always

# ===============================
# ENCODING CONFIGURATION (UTF-8)
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.servlet.encoding.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
spring.messages.encoding=UTF-8

# ===============================
# DATABASE CONFIGURATION (SQL SERVER)
# ===============================
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:127.0.0.1}:${DB_PORT:1433};databaseName=${DB_NAME:RentalShop};encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;TransparentNetworkIPResolution=false;loginTimeout=30;}
spring.datasource.username=${DB_USERNAME:rental_user}
spring.datasource.password=${DB_PASSWORD:RentalShop123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===============================
# SPRING MAIL CONFIGURATION
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply.rentalshop@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:app-password-placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# MOMO PAYMENT GATEWAY CONFIGURATION
# ===============================
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
momo.access-key=${MOMO_ACCESS_KEY:F8BBA842ECF85}
momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1wa8ngf4S01Jn72fhip7aqj7}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.return-url=${MOMO_RETURN_URL:http://localhost:8080/payment/momo-return}
momo.notify-url=${MOMO_NOTIFY_URL:http://localhost:8080/payment/momo-ipn}

# ===============================
# CLOUDINARY CONFIGURATION
# Values loaded from environment variables – never commit real credentials to Git.
# Set CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET in the local
# .env file (ignored by Git), IDE environment variables, or deployment server.
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# MULTIPART / FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Schema repair script was applied; set to never to avoid reconnect crashes during startup.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/repair-schema.sql
spring.sql.init.encoding=UTF-8
app.demo-data.enabled=true
app.rental.enabled=false

# ===============================
# JWT CONFIGURATION
# Set JWT_SECRET in environment variables (min 64 chars for HS256).
# Never commit the real secret to Git.
# ===============================
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-00000000}
# Access token: 15 minutes
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-token-expiration-ms=604800000
