spring.application.name=finalproject

# Server port
server.port=8080
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false
spring.mvc.welcome-page.enabled=false
server.error.include-message=always
server.error.include-stacktrace=always

# ===============================
# DATABASE CONFIGURATION (SQL SERVER SQLEXPRESS)
# ===============================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:64078;databaseName=RentalShop;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;TransparentNetworkIPResolution=false;loginTimeout=30;
spring.datasource.username=rental_user
spring.datasource.password=RentalShop123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===============================
# SPRING MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply.rentalshop@gmail.com
spring.mail.password=app-password-placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=demo
cloudinary.api-key=123456789
cloudinary.api-secret=placeholder_secret

# ===============================
# MULTIPART / FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Schema repair script was applied; set to never to avoid reconnect crashes during startup.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/repair-schema.sql
spring.sql.init.encoding=UTF-8
app.demo-data.enabled=true
app.rental.enabled=false
