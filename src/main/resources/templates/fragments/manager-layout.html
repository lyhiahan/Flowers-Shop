<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="assets">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
        <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
    </th:block>
</head>
<body>
<header th:fragment="mobileHeader" class="manager-mobile-header">
    <a th:href="@{/manager/dashboard}" class="manager-mobile-brand"><img th:src="@{/images/flower-logo.png}" alt="" width="32" height="32">Kênh cửa hàng</a>
    <button class="btn btn-outline-success" type="button" id="managerMenuToggle" aria-controls="managerSidebar" aria-expanded="false" aria-label="Mở menu quản lý"><i class="bi bi-list" aria-hidden="true"></i></button>
</header>
<aside th:fragment="sidebar(active)" class="manager-shell-sidebar" id="managerSidebar" aria-label="Điều hướng quản lý cửa hàng">
    <div class="manager-brand">
        <img th:src="@{/images/flower-logo.png}" alt="Logo tiệm hoa" width="36" height="36">
        <div><strong>TIỆM HOA TƯƠI</strong><span th:text="${managerStore != null ? managerStore.name : 'Kênh quản lý cửa hàng'}">Kênh quản lý cửa hàng</span></div>
        <button type="button" class="manager-menu-close" id="managerMenuClose" aria-label="Đóng menu"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>
    <nav class="manager-navigation" aria-label="Chức năng quản lý">
        <a th:href="@{/manager/dashboard}" id="sidebarDashboard" th:classappend="${active == 'dashboard'} ? 'active'" th:attr="aria-current=${active == 'dashboard' ? 'page' : null}"><i class="bi bi-speedometer2" aria-hidden="true"></i>Tổng quan</a>
        <a th:href="@{/manager/orders}" id="sidebarOrders" th:classappend="${active == 'orders'} ? 'active'" th:attr="aria-current=${active == 'orders' ? 'page' : null}"><i class="bi bi-bag-check" aria-hidden="true"></i>Đơn hàng</a>
        <a th:href="@{/manager/products}" id="sidebarProducts" th:classappend="${active == 'products'} ? 'active'" th:attr="aria-current=${active == 'products' ? 'page' : null}"><i class="bi bi-flower1" aria-hidden="true"></i>Sản phẩm</a>
        <a th:href="@{/manager/staff}" id="sidebarStaffs" th:classappend="${active == 'staff'} ? 'active'" th:attr="aria-current=${active == 'staff' ? 'page' : null}"><i class="bi bi-people" aria-hidden="true"></i>Nhân viên</a>
        <a th:href="@{/manager/wallet}" id="sidebarGdCoins" th:classappend="${active == 'wallet'} ? 'active'" th:attr="aria-current=${active == 'wallet' ? 'page' : null}"><i class="bi bi-coin" aria-hidden="true"></i>Ví cửa hàng</a>
        <a th:href="@{/manager/vouchers}" id="sidebarVouchers" th:classappend="${active == 'vouchers'} ? 'active'" th:attr="aria-current=${active == 'vouchers' ? 'page' : null}"><i class="bi bi-ticket-perforated" aria-hidden="true"></i>Khuyến mãi</a>
        <a th:href="@{/manager/analytics}" id="sidebarAnalytics" th:classappend="${active == 'analytics'} ? 'active'" th:attr="aria-current=${active == 'analytics' ? 'page' : null}"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i>Báo cáo doanh thu</a>
        <a th:href="@{/manager/stores}" id="sidebarStores" th:classappend="${active == 'stores'} ? 'active'" th:attr="aria-current=${active == 'stores' ? 'page' : null}"><i class="bi bi-shop" aria-hidden="true"></i>Cửa hàng của tôi</a>
        <a th:href="@{/manager/profile}" id="sidebarProfile" th:classappend="${active == 'profile'} ? 'active'" th:attr="aria-current=${active == 'profile' ? 'page' : null}"><i class="bi bi-person-badge" aria-hidden="true"></i>Thông tin cửa hàng</a>
        <a th:href="@{/notifications}" id="sidebarNotifications"><i class="bi bi-bell" aria-hidden="true"></i>Thông báo</a>
    </nav>
    <div class="manager-shell-sidebar-footer">
        <a th:href="@{/}" target="_blank" rel="noopener"><i class="bi bi-house-door" aria-hidden="true"></i>Xem trang bán hàng</a>
        <button type="button" data-bs-toggle="modal" data-bs-target="#signOutModal"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Đăng xuất</button>
    </div>
</aside>
<th:block th:fragment="footer">
    <button type="button" class="manager-menu-overlay" id="managerMenuOverlay" aria-label="Đóng menu quản lý" hidden></button>
    <div class="modal fade" id="signOutModal" tabindex="-1" aria-labelledby="signOutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="signOutModalLabel">Xác nhận đăng xuất</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
            <div class="modal-body">Bạn có muốn đăng xuất khỏi tài khoản quản lý cửa hàng?</div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button><form th:action="@{/logout}" method="post" class="m-0"><button type="submit" class="btn btn-danger">Đăng xuất</button></form></div>
        </div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/manager-layout.js}"></script>
</th:block>
</body>
</html>
