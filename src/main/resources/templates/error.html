<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lỗi - Tiệm Hoa Tươi Sài Gòn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
    <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
</head>
<body class="bg-light">
<div class="container py-5 text-center min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 p-4 p-md-5" style="max-width: 520px; width: 100%; border-radius: 16px;">
        <div class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; background: #FDE8E8; color: #E02424;">
            <i class="bi bi-exclamation-triangle fs-1"></i>
        </div>
        <h3 class="fw-bold mb-2 text-dark">Thông Báo Hệ Thống</h3>
        <p class="text-muted small mb-4">Đã có vấn đề phát sinh khi xử lý yêu cầu của bạn.</p>
        
        <div class="alert alert-danger border-0 rounded-3 py-3 mb-4 text-start small" style="background-color: #FDF2F2; color: #9B1C1C;">
            <div th:if="${status != null}" class="fw-bold mb-1">Mã lỗi: <span th:text="${status}">500</span> <span th:if="${error != null}" th:text="'(' + ${error} + ')'"></span></div>
            <div th:text="${message != null and !#strings.isEmpty(message) ? message : (errorMessage != null ? errorMessage : 'Hệ thống đang tạm thời gián đoạn kết nối. Vui lòng thử lại sau ít phút.')}">
                Hệ thống đang tạm thời gián đoạn kết nối. Vui lòng thử lại sau ít phút.
            </div>
        </div>
        
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-3 rounded-pill" style="font-size: 14px;">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
            <a th:href="@{/}" class="btn btn-primary px-4 rounded-pill" style="font-size: 14px; background-color: #20382E; border-color: #20382E;">
                <i class="bi bi-house me-1"></i> Trang chủ
            </a>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/chat-widget :: widget}"></th:block>
</body>
</html>
