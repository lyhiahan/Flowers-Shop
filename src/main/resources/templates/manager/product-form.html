<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/store-ui :: head('Thông tin sản phẩm')}"></head><body><nav th:replace="~{fragments/store-ui :: nav(false)}"></nav><main class="container py-4"><h1 class="h3" th:text="${product.id == null ? 'New product' : 'Edit product'}"></h1><form th:action="${product.id == null} ? @{/manager/products/add} : @{/manager/products/update/{id}(id=${product.id})}" method="post" enctype="multipart/form-data" data-confirm="Xác nhận lưu thông tin sản phẩm?" class="card p-4"><label class="form-label">Tên sản phẩm<input name="name" th:value="${product.name}" required maxlength="200" class="form-control"></label><label class="form-label">Danh mục<select name="categoryId" required class="form-select"><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null and product.category.id == c.id}"></option></select></label><label class="form-label">Giá bán<input name="priceBuy" type="number" min="0.01" step="0.01" required th:value="${product.priceBuy}" class="form-control"></label><label class="form-label">Giá khuyến mãi<input name="promotionalPrice" type="number" min="0.01" step="0.01" th:value="${product.promotionalPrice}" class="form-control"></label><label th:if="${product.id == null}" class="form-label">Tồn kho ban đầu<input name="initialStock" type="number" min="0" max="1000000" value="0" required class="form-control"></label><label class="form-label">Ảnh<input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="form-control"></label><label class="form-label">Hoặc URL ảnh<input name="imageUrl" th:value="${product.imageUrl}" maxlength="500" class="form-control"></label><label class="form-label">Mô tả<textarea name="description" th:text="${product.description}" class="form-control"></textarea></label><div class="d-flex gap-3 mt-3"><button class="btn btn-success" type="submit">Submit</button><a class="btn btn-outline-secondary" th:href="@{/manager/products}">Cancel</a></div></form></main><script src="/js/global-modal.js"></script><script src="/js/store-confirm.js"></script></body></html>
