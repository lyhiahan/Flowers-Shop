<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực Kích Hoạt Tài Khoản - Chuỗi Cửa Hàng Hoa Tươi</title>
    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --flower-primary: #e11d48;
            --flower-soft-pink: #fff1f2;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #fef2f2 50%, #fdf2f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .font-serif {
            font-family: 'Playfair Display', Georgia, serif;
        }
        .otp-card {
            border: 1px solid #ffe4e6;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.1), 0 8px 10px -6px rgba(225, 29, 72, 0.1);
        }
        .letter-spacing-2 {
            letter-spacing: 0.35em;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card otp-card bg-white p-2">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="fs-1 mb-2">🌸</div>
                        <h3 class="font-serif fw-bold text-dark mb-1">XÁC THỰC TÀI KHOẢN</h3>
                        <p class="text-muted small">
                            Mã xác thực 6 chữ số đã được gửi tới email:<br>
                            <strong class="text-danger" th:text="${email}"></strong>
                        </p>
                    </div>

                    <!-- Bước 8: Thông báo đăng ký thành công -->
                    <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small rounded-3 mb-3 fw-semibold">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                    </div>


                    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/verify-otp}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="email" th:value="${email}">
                        <div class="mb-3">
                            <label class="form-label text-center w-100 fw-semibold text-secondary small">Nhập mã OTP (Hiệu lực trong 5 phút)</label>
                            <input type="text" name="otpCode" class="form-control text-center fs-4 letter-spacing-2 rounded-pill"
                                   maxlength="6" placeholder="------" required autofocus
                                   oninvalid="this.setCustomValidity('Vui lòng điền mã xác thực OTP!')"
                                   oninput="this.setCustomValidity('')">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
                            <i class="bi bi-shield-check me-1"></i> Xác Nhận Kích Hoạt
                        </button>
                    </form>

                    <form th:action="@{/resend-otp}" method="post" class="text-center mb-2">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="email" th:value="${email}">
                        <button type="submit" class="btn btn-link text-decoration-none small text-danger fw-semibold">
                            <i class="bi bi-arrow-repeat me-1"></i> Chưa nhận được mã? Gửi lại OTP
                        </button>
                    </form>

                    <div class="text-center mt-3 border-top pt-3">
                        <a th:href="@{/login}" class="text-secondary small text-decoration-none">← Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/form-validation.js}"></script>
</body>
</html>
