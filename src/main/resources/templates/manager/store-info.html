<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Hồ Sơ Chi Nhánh - Chuỗi Cửa Hàng Hoa Tươi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .sidebar { background: #1e293b; min-height: 100vh; color: #e2e8f0; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #38bdf8; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-3 sidebar">
            <div class="d-flex align-items-center gap-2 mb-4 px-2">
                <span class="fs-4">💐</span>
                <div>
                    <h6 class="font-serif fw-bold text-white mb-0">CỬA HÀNG HOA</h6>
                    <small class="text-secondary" th:text="${store.name}"></small>
                </div>
            </div>
            <nav class="d-flex flex-column gap-1">
                <a th:href="@{/manager/orders}"><i class="bi bi-bag-check"></i> Quản Lý Đơn Hàng</a>
                <a th:href="@{/manager/products}"><i class="bi bi-flower1"></i> Kho Mẫu Hoa</a>
                <a th:href="@{/manager/staff}"><i class="bi bi-people"></i> Nhân Viên Cửa Hàng</a>
                <a th:href="@{/manager/wallet}"><i class="bi bi-wallet2"></i> Ví Cửa Hàng & Rút Tiền</a>
                <a th:href="@{/manager/vouchers}"><i class="bi bi-ticket-perforated"></i> Khuyến Mãi Shop</a>
                <a th:href="@{/manager/analytics}"><i class="bi bi-graph-up-arrow"></i> Báo Cáo Doanh Thu</a>
                <a th:href="@{/manager/stores}" class="active"><i class="bi bi-shop"></i> Thông Tin Chi Nhánh</a>
                <hr class="border-secondary my-2">
                <a th:href="@{/}"><i class="bi bi-house-door"></i> Xem Website Khách</a>
                <a th:href="@{/logout}" class="text-danger"><i class="bi bi-box-arrow-right"></i> Đăng Xuất</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="mb-4">
                <a th:href="@{/manager/stores}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Quay lại danh sách chi nhánh</a>
                <h3 class="font-serif fw-bold mt-2">⚙️ Cập Nhật Hồ Sơ Cửa Hàng Hoa</h3>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 700px;">
                <form th:action="@{'/manager/stores/edit/' + ${store.id}}" th:object="${store}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Tên chi nhánh cửa hàng hoa:</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Số điện thoại hotline chi nhánh:</label>
                        <input type="text" th:field="*{phone}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Địa chỉ chi nhánh chi tiết:</label>
                        <input type="text" th:field="*{address}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Giới thiệu ngắn về cửa hàng:</label>
                        <textarea th:field="*{bio}" rows="3" class="form-control"></textarea>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">URL Ảnh đại diện cửa hàng (Avatar):</label>
                            <input type="text" th:field="*{avatar}" class="form-control" placeholder="https://...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">URL Ảnh bìa cửa hàng (Cover):</label>
                            <input type="text" th:field="*{cover}" class="form-control" placeholder="https://...">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">URL Ảnh đặc trưng cửa hàng (Featured Images):</label>
                        <input type="text" th:field="*{featuredImages}" class="form-control" placeholder="https://...">
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" th:field="*{isOpen}" id="isOpenSwitch">
                        <label class="form-check-label small fw-semibold" for="isOpenSwitch">Đang mở cửa đón khách và nhận đơn</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Lưu Thay Đổi</button>
                        <a th:href="@{/manager/stores}" class="btn btn-light rounded-pill px-4">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
