<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<title>Thông tin sản phẩm - Kênh cửa hàng</title>
<th:block th:replace="~{fragments/manager-layout :: assets}"></th:block>

<link rel="stylesheet" th:href="@{/css/manager-layout.css}">
</head>
<body class="manager-page">
<header th:replace="~{fragments/manager-layout :: mobileHeader}"></header>
<div class="manager-layout">
    <aside th:replace="~{fragments/manager-layout :: sidebar('products')}"></aside>
    <main id="managerMain" class="manager-main">
<div class="manager-form-page">
    <header class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div><h1 th:text="${product.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">Thông tin sản phẩm</h1><p class="text-muted mb-0">Quản lý thông tin, giá bán và hình ảnh mẫu hoa của cửa hàng.</p></div>
        <a class="btn btn-outline-success" th:href="@{/manager/products}"><i class="bi bi-arrow-left me-2"></i>Danh sách sản phẩm</a>
    </header>
    <form th:action="${product.id == null} ? @{/manager/products/add} : @{/manager/products/update/{id}(id=${product.id})}" method="post" enctype="multipart/form-data" data-confirm="Xác nhận lưu thông tin sản phẩm?" class="card">
        <div class="manager-form-grid">
            <div class="full-width"><label for="productName" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label><input id="productName" name="name" th:value="${product.name}" required maxlength="200" class="form-control" placeholder="Nhập tên mẫu hoa"></div>
            <div><label for="productCategory" class="form-label">Danh mục <span class="text-danger">*</span></label><select id="productCategory" name="categoryId" required class="form-select"><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product.category != null and product.category.id == c.id}"></option></select></div>
            <div th:if="${product.id == null}"><label for="productStock" class="form-label">Tồn kho ban đầu <span class="text-danger">*</span></label><input id="productStock" name="initialStock" type="number" min="0" max="1000000" value="0" required class="form-control"></div>
            <div><label for="productPrice" class="form-label">Giá bán (VND) <span class="text-danger">*</span></label><input id="productPrice" name="priceBuy" type="number" min="0.01" step="0.01" required th:value="${product.priceBuy}" class="form-control" placeholder="Ví dụ: 250000"></div>
            <div><label for="productPromotion" class="form-label">Giá khuyến mãi (VND)</label><input id="productPromotion" name="promotionalPrice" type="number" min="0.01" step="0.01" th:value="${product.promotionalPrice}" class="form-control" placeholder="Để trống nếu không áp dụng"></div>
            <div><label for="productImageFile" class="form-label">Ảnh sản phẩm</label><input id="productImageFile" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="form-control" aria-describedby="productImageHelp"><div id="productImageHelp" class="form-text">JPEG, PNG, GIF hoặc WEBP; tối đa 10 MB.</div></div>
            <div><label for="productImageUrl" class="form-label">Hoặc đường dẫn ảnh</label><input id="productImageUrl" name="imageUrl" th:value="${product.imageUrl}" maxlength="500" class="form-control" placeholder="https://..."></div>
            <div class="full-width"><label for="productDescription" class="form-label">Mô tả</label><textarea id="productDescription" name="description" th:text="${product.description}" class="form-control" rows="4" placeholder="Giới thiệu mẫu hoa, chất liệu và dịp sử dụng"></textarea></div>
        </div>
        <div class="d-flex justify-content-end flex-wrap gap-2 mt-4 pt-3 border-top"><a class="btn btn-light" th:href="@{/manager/products}">Hủy</a><button class="btn btn-primary" type="submit">Lưu sản phẩm</button></div>
    </form>
</div>
    </main>
</div>

<th:block th:replace="~{fragments/manager-layout :: footer}"></th:block>
<script src="/js/store-confirm.js"></script>
<script th:src="@{/js/global-modal.js}"></script>
</body>
</html>
