# Local development settings only; environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties]
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false
app.demo-payment.enabled=true
app.demo-payment.auto-tunnel.enabled=${DEMO_PAYMENT_AUTO_TUNNEL_ENABLED:true}
app.demo-payment.base-url=https://wall-petite-cells-fragrances.trycloudflare.com  
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RentalShop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;loginTimeout=15;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.flyway.baseline-on-migrate=true
# Demo fixtures require explicit opt-in even in development.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
