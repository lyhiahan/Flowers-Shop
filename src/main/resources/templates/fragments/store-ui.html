<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head xmlns:th="http://www.thymeleaf.org" th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">FlowerShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/floral-theme.css}"></head><body><nav xmlns:th="http://www.thymeleaf.org" th:fragment="nav(admin)" class="navbar navbar-expand bg-white border-bottom mb-4 px-3"><a class="navbar-brand" th:href="@{/}">FlowerShop</a><div class="d-flex gap-3 flex-wrap"><a th:href="${admin} ? @{/admin/dashboard} : @{/manager/dashboard}">Dashboard</a><a th:href="${admin} ? @{/admin/stores} : @{/manager/stores}">Shop Manager</a><a th:if="${!admin}" th:href="@{/manager/profile}">Profile</a><a th:if="${!admin}" th:href="@{/manager/staff}">Staffs</a><a th:if="${!admin}" th:href="@{/manager/products}">Products</a><a th:href="${admin} ? @{/admin/orders} : @{/manager/orders}">Orders</a><a th:href="${admin} ? @{/admin/transactions} : @{/manager/wallet}">GD Coins</a><a th:if="${admin}" id="sidebarUsersLink" href="/admin/users">Users</a><a th:if="${admin}" id="sidebarProductsLink" href="/admin/products-manage">Products</a><a th:if="${admin}" id="sidebarOrdersLink" href="/admin/orders-manage">Orders</a><a th:if="${admin}" id="sidebarCategoriesLink" href="/admin/categories">Categories</a><a th:if="${admin}" id="sidebarCommissionsLink" href="/admin/commissions">Commissions</a><a th:if="${admin}" id="sidebarDeliveriesLink" href="/admin/deliveries">Deliveries</a><a th:if="${admin}" id="sidebarStoreLevelsLink" href="/admin/store-levels">StoreLevels</a><a th:if="${admin}" id="sidebarUserLevelsLink" href="/admin/user-levels">UserLevels</a><a th:if="${admin}" id="sidebarStylesLink" href="/admin/styles">Styles</a><a th:if="${admin}" id="sidebarTransactionsLink" href="/admin/transactions">Transactions</a><a th:if="${admin}" id="sidebarVouchersLink" href="/admin/vouchers">Vouchers</a></div></nav><nav th:fragment="pager(p)" th:if="${p != null}" class="d-flex align-items-center gap-2" aria-label="Phân trang thống kê"><a th:href="${p.previous}" class="btn btn-sm btn-outline-success" th:classappend="${p.page == 1} ? 'disabled' : ''">Previous</a><span th:text="${p.page + ' / ' + p.pages}"></span><a th:href="${p.next}" class="btn btn-sm btn-outline-success" th:classappend="${p.page == p.pages} ? 'disabled' : ''">Next</a></nav></body></html>
