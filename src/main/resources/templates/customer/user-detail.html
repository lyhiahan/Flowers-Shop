<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/floral :: head('Hồ sơ thành viên')}"></head>
<body><header th:replace="~{fragments/floral :: header}"></header>
<main class="container py-4 floral-page"><h1 class="mb-4">Hồ sơ thành viên</h1><div th:replace="~{fragments/floral :: flashes}"></div><a th:href="@{/users}" class="btn btn-outline-secondary mb-4">Danh sách thành viên</a><article class="card overflow-hidden"><img th:if="${user.cover != null and !user.cover.isEmpty()}" th:src="${user.cover}" class="floral-cover" alt="Ảnh bìa"><div class="card-body p-4"><img class="floral-avatar mb-3" th:src="${user.avatarUrl != null and !user.avatarUrl.isEmpty() ? user.avatarUrl : '/images/flower-logo.png'}" alt="Ảnh đại diện"><h2 th:text="${user.fullName != null ? user.fullName : user.username}"></h2><p class="text-muted" th:text="'@' + ${user.username}"></p><p th:if="${user.createdDate != null}" th:text="'Tham gia từ ' + ${#temporals.format(user.createdDate,'dd/MM/yyyy')}"></p><a th:if="${user.store != null}" th:href="@{/stores/{id}(id=${user.store.id})}" class="btn btn-outline-success" th:text="${user.store.name}"></a></div></article></main>
<footer th:replace="~{fragments/floral :: footer}"></footer><th:block th:replace="~{fragments/floral :: scripts}"></th:block></body></html>
