<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lại Mật Khẩu - Bloom Flower Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #fef2f2 50%, #fdf2f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .card-box {
            border: 1px solid #ffe4e6;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.1);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-box bg-white p-2">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="fs-1 mb-2">🔒</div>
                        <h3 class="font-serif fw-bold text-dark mb-1">Tạo Mật Khẩu Mới</h3>
                        <p class="text-muted small">Nhập mã OTP vừa nhận qua email và đặt mật khẩu mới</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small rounded-3" th:text="${successMessage}"></div>

                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Email nhận mã</label>
                            <input type="text" class="form-control bg-light" th:value="${email}" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Mã OTP (6 chữ số)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                                <input type="text" name="otpCode" class="form-control border-start-0 ps-0 text-center fw-bold letter-spacing-2" required maxlength="6" placeholder="Ví dụ: 123456" autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" name="newPassword" class="form-control border-start-0 ps-0" required minlength="6" placeholder="Nhập mật khẩu mới">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
                            ✨ Xác Nhận Đổi Mật Khẩu
                        </button>
                    </form>

                    <div class="text-center text-muted small">
                        <a th:href="@{/login}" class="text-secondary text-decoration-none">← Quay lại trang đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
