<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Rental Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">🏕️ RENTAL SHOP</h3>
                        <p class="text-muted">Đăng nhập tài khoản của bạn</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/perform_login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" required autofocus placeholder="Nhập username">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Đăng Nhập</button>
                    </form>

                    <div class="text-center text-muted small">
                        Chưa có tài khoản? <a th:href="@{/register}" class="text-decoration-none">Đăng ký ngay</a>
                        <div class="mt-2">
                            <a th:href="@{/}" class="text-secondary text-decoration-none">← Quay lại trang chủ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
