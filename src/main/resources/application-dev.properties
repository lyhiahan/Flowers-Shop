spring.devtools.restart.enabled=false
spring.thymeleaf.cache=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1;instanceName=SQLEXPRESS;databaseName=RentalShop;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;loginTimeout=15;}
# Demo fixtures require explicit opt-in even in development.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
