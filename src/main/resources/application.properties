spring.application.name=finalproject

# Server port
server.port=8080
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
spring.mvc.welcome-page.enabled=false
server.error.include-message=always
server.error.include-stacktrace=always

# ===============================
# DATABASE CONFIGURATION (SQL SERVER SQLEXPRESS)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RentalShop;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;TransparentNetworkIPResolution=false;loginTimeout=15;}
spring.datasource.username=rental_user
spring.datasource.password=RentalShop123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===============================
# SPRING MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:noreply.rentalshop@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:app-password-placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# CLOUDINARY CONFIGURATION
# Environment variables can override the project account configured below.
# Set CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET in your IDE Run
# Configuration (Environment Variables) or on the deployment server.
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:hquyvrip}
cloudinary.api-key=${CLOUDINARY_API_KEY:327624677692986}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:f2-hiIyIlOjcarigLKLXB-qGbs8}

# ===============================
# MULTIPART / FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Schema repair script was applied; set to never to avoid reconnect crashes during startup.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/repair-schema.sql
spring.sql.init.encoding=UTF-8
app.demo-data.enabled=true

# MoMo for development only: local simulation by default, no real money.
momo.mode=${MOMO_MODE:mock}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/checkout/momo/callback}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/checkout/momo/ipn}
app.rental.enabled=false

