<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Của Tôi - Hoa Tươi Sài Gòn</title>
    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
    <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FBF9F7; }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
        .notif-card {
            background: #ffffff;
            border: 1px solid #EFEAE4;
            border-radius: 16px;
            padding: 18px 24px;
            transition: all 0.2s ease;
            position: relative;
        }
        .notif-card:hover {
            border-color: #E2D7D1;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }
        .notif-card.unread {
            background-color: #FFF9FA;
            border-left: 4px solid #E11D48;
        }
        .notif-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top shadow-sm bg-white" style="border-bottom: 1px solid #EFEAE4;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <img th:src="@{/images/flower-logo.png}" alt="Logo" class="brand-logo-img" style="height: 38px;">
            <span class="font-serif fw-bold text-dark fs-5">HOA TƯƠI SÀI GÒN</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/customer/orders}" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                <i class="bi bi-bag-check me-1"></i> Đơn Mua
            </a>
            <a th:href="@{/cart}" class="btn btn-sm btn-outline-dark rounded-pill px-3">
                <i class="bi bi-cart3 me-1"></i> Giỏ Hàng
            </a>
            <a th:href="@{/customer/profile}" class="btn btn-sm btn-light border rounded-pill px-3">
                <i class="bi bi-person me-1"></i> Tài Khoản
            </a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 860px;">
    <!-- Tiêu đề & Nút đánh dấu đã đọc tất cả -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="font-serif fw-bold text-dark mb-1">Trung Tâm Thông Báo</h2>
            <p class="text-muted small mb-0">Cập nhật tiến độ đơn hàng và giao dịch của bạn</p>
        </div>
        <button th:if="${unreadCount > 0}" onclick="markAllRead()" class="btn btn-sm btn-outline-danger rounded-pill px-3">
            <i class="bi bi-check2-all me-1"></i> Đánh dấu đã đọc tất cả
        </button>
    </div>

    <!-- Danh sách thông báo rỗng -->
    <div th:if="${#lists.isEmpty(notifications)}" class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
        <div class="fs-1 mb-2">🔔</div>
        <h5 class="fw-bold text-dark">Bạn chưa có thông báo nào</h5>
        <p class="text-muted small">Mọi cập nhật về trạng thái đơn hoa và thanh toán sẽ xuất hiện tại đây.</p>
        <div>
            <a th:href="@{/}" class="btn btn-danger btn-sm rounded-pill px-4">Khám Phá Mẫu Hoa</a>
        </div>
    </div>

    <!-- Danh sách thông báo -->
    <div th:if="${not #lists.isEmpty(notifications)}" class="d-flex flex-column gap-3">
        <div th:each="n : ${notifications}" 
             class="notif-card" 
             th:classappend="${!n.isRead} ? 'unread' : ''"
             th:id="'notif_' + ${n.id}">
            <div class="d-flex align-items-start gap-3">
                <!-- Icon theo loại thông báo -->
                <div class="notif-icon-circle" 
                     th:style="${n.type == 'PAYMENT_SUCCESS'} ? 'background-color: #FDF2F8; color: #DB2777;' : 
                                (${n.type == 'ORDER_CREATED'} ? 'background-color: #ECFDF5; color: #059669;' : 
                                (${n.type == 'ORDER_DELIVERED'} ? 'background-color: #FEF3C7; color: #D97706;' : 'background-color: #EFF6FF; color: #2563EB;'))">
                    <i th:class="${n.type == 'PAYMENT_SUCCESS'} ? 'bi bi-credit-card-fill' : 
                                (${n.type == 'ORDER_CREATED'} ? 'bi bi-bag-plus-fill' : 
                                (${n.type == 'ORDER_DELIVERED'} ? 'bi bi-flower1' : 'bi bi-bell-fill'))"></i>
                </div>

                <!-- Nội dung thông báo -->
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-baseline mb-1">
                        <h6 class="fw-bold text-dark mb-0" th:text="${n.title}">Tiêu đề</h6>
                        <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <p class="text-secondary small mb-2" th:text="${n.content}">Nội dung</p>
                    
                    <div class="d-flex align-items-center gap-3">
                        <a th:if="${n.relatedOrderId != null}" 
                           th:href="@{'/customer/orders/detail/' + ${n.relatedOrderId}}" 
                           onclick="markReadDirect(this)"
                           th:data-id="${n.id}"
                           class="btn btn-sm btn-light border rounded-pill px-3 text-danger fw-semibold" style="font-size: 12px;">
                            Xem đơn hoa #<span th:text="${n.relatedOrderId}"></span> <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                        <button th:if="${!n.isRead}" 
                                onclick="markOneRead(this)" 
                                th:data-id="${n.id}" 
                                class="btn btn-link btn-sm text-muted p-0 text-decoration-none" style="font-size: 12px;">
                            <i class="bi bi-check2"></i> Đánh dấu đã đọc
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function markOneRead(btn) {
        const id = btn.getAttribute('data-id');
        fetch('/api/notifications/read/' + id, { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                const card = document.getElementById('notif_' + id);
                if (card) {
                    card.classList.remove('unread');
                    btn.remove();
                }
            });
    }

    function markReadDirect(link) {
        const id = link.getAttribute('data-id');
        if (id) {
            fetch('/api/notifications/read/' + id, { method: 'POST' });
        }
    }

    function markAllRead() {
        fetch('/api/notifications/read-all', { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                location.reload();
            });
    }
</script>
</body>
</html>
