<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực OTP - Rental Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">🔐 XÁC THỰC TÀI KHOẢN</h3>
                        <p class="text-muted small">
                            Mã xác thực 6 chữ số đã được gửi tới email:<br>
                            <strong class="text-primary" th:text="${email}"></strong>
                        </p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/verify-otp}" method="post">
                        <input type="hidden" name="email" th:value="${email}">
                        <div class="mb-3">
                            <label class="form-label text-center w-100">Nhập mã OTP (Hiệu lực 120 giây)</label>
                            <input type="text" name="otpCode" class="form-control text-center fs-4 letter-spacing-2"
                                   maxlength="6" placeholder="------" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 mb-3">Xác Nhận Kích Hoạt</button>
                    </form>

                    <form th:action="@{/resend-otp}" method="post" class="text-center">
                        <input type="hidden" name="email" th:value="${email}">
                        <button type="submit" class="btn btn-link text-decoration-none small text-muted">
                            Chưa nhận được mã? Gửi lại OTP
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-secondary small text-decoration-none">← Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
