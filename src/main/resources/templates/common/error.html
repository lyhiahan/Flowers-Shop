<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lỗi - Tiệm Hoa Tươi Sài Gòn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
    <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
</head>
<body>
<div class="container py-5 text-center min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-floral shadow-sm border-0 p-5" style="max-width: 520px; width: 100%;">
        <div class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; background: var(--accent-rose-soft); color: var(--accent-rose);">
            <i class="bi bi-exclamation-diamond fs-1"></i>
        </div>
        <h3 class="font-serif fw-bold mb-2">Thông Báo Hệ Thống</h3>
        <p class="text-muted small mb-4">Đã có vấn đề phát sinh khi xử lý yêu cầu của bạn.</p>
        
        <div class="alert alert-warning border-0 rounded-3 py-3 mb-4" style="background-color: var(--amber-bg); color: var(--amber-text);" th:text="${errorMessage}">
            Đã xảy ra lỗi không xác định.
        </div>
        
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-primary px-3 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
            <a th:href="@{/}" class="btn btn-primary px-4 rounded-pill">
                <i class="bi bi-house me-1"></i> Trang chủ
            </a>
        </div>
    </div>
</div>
</body>
</html>
