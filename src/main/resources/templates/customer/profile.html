<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Cá Nhân - Rental Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="mb-0">Hồ Sơ Cá Nhân</h3>
                        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Trang chủ</a>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <div class="text-center mb-4">
                        <img th:src="${user.avatarUrl != null ? user.avatarUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"
                             class="rounded-circle border" width="110" height="110" alt="Avatar" style="object-fit: cover;">
                        <h5 class="mt-2 mb-0 fw-bold" th:text="${user.fullName}"></h5>
                        <small class="text-muted" th:text="'Ngày tham gia: ' + ${user.createdDate}"></small>
                    </div>

                    <form th:action="@{/customer/profile/update}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Tên đăng nhập (Chỉ xem)</label>
                            <input type="text" class="form-control" th:value="${user.username}" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small">Email (Chỉ xem)</label>
                            <input type="email" class="form-control" th:value="${user.email}" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên (*)</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Thay đổi Ảnh đại diện</label>
                                <input type="file" name="avatarFile" class="form-control" accept="image/*">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Địa chỉ giao nhận hàng</label>
                            <input type="text" name="address" class="form-control" th:value="${user.address}">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Lưu Thay Đổi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
