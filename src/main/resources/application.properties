spring.application.name=finalproject
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
app.demo-payment.enabled=false
app.demo-payment.base-url=${DEMO_PAYMENT_BASE_URL:}
app.demo-payment.auto-tunnel.enabled=false
spring.mvc.welcome-page.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.devtools.restart.enabled=false
spring.thymeleaf.cache=true

# Provide credentials through environment variables; no shared passwords in Git.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RentalShop;encrypt=true;trustServerCertificate=false;sendStringParametersAsUnicode=true;loginTimeout=15;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Thymeleaf currently traverses lazy relations while rendering. Keep the persistence
# context available for views until the existing screens migrate to projection DTOs.
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# Flyway is the sole production schema owner. Existing installations must explicitly
# baseline version 1 after verifying the database; never auto-baseline an unknown DB.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlserver,classpath:com/finalproject/db/migration
spring.flyway.default-schema=dbo
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=12000
spring.mail.properties.mail.smtp.writetimeout=12000
# Default OTP delivery uses an email API, not a Gmail App Password.
app.mail.provider=${MAIL_PROVIDER:brevo}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Hoa Tươi Sài Gòn}
app.mail.brevo.api-key=${BREVO_API_KEY:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.demo-data.enabled=false
app.rental.enabled=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:flower-shop-chain}
app.jwt.audience=flower-shop-api
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

momo.mode=${MOMO_MODE:mock}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/checkout/momo/callback}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/checkout/momo/ipn}
