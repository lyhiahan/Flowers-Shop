<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Thêm Mẫu Hoa & Phụ Kiện Mới - Quản Trị Hệ Thống Hoa Tươi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/flower-logo.png}">
    <link rel="stylesheet" th:href="@{/css/floral-theme.css}">
</head>
<body class="admin-body">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="font-serif fw-bold">Thêm Mẫu Hoa / Phụ Kiện Mới</h2>
        <a th:href="@{/admin/products}" class="btn btn-outline-forest rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> Quay lại danh sách</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form id="productForm" th:action="@{/admin/products/create}" th:object="${productForm}" method="post" enctype="multipart/form-data">
                
                <!-- Cờ xác nhận bán lỗ (mặc định false) -->
                <input type="hidden" th:field="*{confirmSellAtLoss}" id="confirmSellAtLoss">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">Danh mục sản phẩm (*)</label>
                        <select th:field="*{categoryId}" class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tên sản phẩm (*)</label>
                        <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giá nhập gốc (VNĐ) (*)</label>
                        <input type="number" th:field="*{importPrice}" class="form-control" th:classappend="${#fields.hasErrors('importPrice')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{importPrice}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giá bán (VNĐ) (*)</label>
                        <input type="number" th:field="*{priceBuy}" id="priceBuyInput" class="form-control" th:classappend="${#fields.hasErrors('priceBuy')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:errors="*{priceBuy}"></div>
                    </div>
                </div>

                <!-- Ẩn các trường cho thuê và cọc (hệ thống chỉ bán hoa tươi) -->
                <input type="hidden" th:field="*{priceRentPerDay}" value="0">
                <input type="hidden" th:field="*{depositFee}" value="0">

                <div class="mb-3">
                    <label class="form-label">Mô tả chi tiết</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Hình ảnh sản phẩm (chọn nhiều ảnh, ảnh đầu làm ảnh chính)</label>
                    <input type="file" th:field="*{imageFiles}" class="form-control" multiple accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary px-4">Lưu Sản Phẩm</button>
                <div class="mb-3"><label>Tồn kho ban đầu mỗi chi nhánh</label><input type="number" th:field="*{initialStock}" min="0" max="1000000" class="form-control"></div>
            </form>
        </div>
    </div>
</div>

<!-- MODAL CẢNH BÁO BÁN LỖ (YES/NO) -->
<div class="modal fade" id="lossWarningModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title font-weight-bold">⚠️ CẢNH BÁO MẤT LỢI NHUẬN!</h5>
            </div>
            <div class="modal-body">
                <p>Giá bán đứt vừa nhập (<strong th:text="${priceBuyVal}"></strong>đ) đang thấp hơn Giá nhập hàng gốc (<strong th:text="${importPriceVal}"></strong>đ).</p>
                <p class="mb-0">Hành động này sẽ khiến cửa hàng bị bán lỗ. Bạn có chắc chắn muốn xác nhận xả lỗ sản phẩm này không?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="handleNo()">Nhập lại</button>
                <button type="button" class="btn btn-danger" onclick="handleYes()">Xác nhận bán lỗ</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    var showModal = /*[[${showLossWarningModal}]]*/ false;
    if (showModal) {
        var modalElement = new bootstrap.Modal(document.getElementById('lossWarningModal'));
        modalElement.show();
    }

    function handleNo() {
        var modalEl = document.getElementById('lossWarningModal');
        var modalInstance = bootstrap.Modal.getInstance(modalEl);
        modalInstance.hide();
        var priceInput = document.getElementById('priceBuyInput');
        priceInput.focus();
        priceInput.classList.add('is-invalid');
    }

    function handleYes() {
        document.getElementById('confirmSellAtLoss').value = 'true';
        document.getElementById('productForm').submit();
    }
    /*]]>*/
</script>
</body>
</html>
